function normalizeSettings(data={}){

 const ranges={maxMultiplier:[1,10,true],ballCount:[1,10,true],maxTotalBalls:[1,10,true],extraBallChance:[0,100,false],autoSkill:[1,5,true],overallMultiplier:[0,2,false],tierAmount:[0,10000,false],tierPoints:[1,1000000,true],ballHue:[0,360,false],ballSaturation:[0,100,false],ballGlow:[0,40,false]};

 for(const key of ['defaultAutoplay','defaultSound']){const value=data[key];result[key]=value==null?DEFAULT_SETTINGS[key]:value===true||value==='true';}
 result.tieredMode=data.tieredMode===true||data.tieredMode==='true';return result;
}

function sample(points,t){
const u=clamp(t,0,1)*(points.length-1),i=Math.min(points.length-2,Math.floor(u)),f=u-i;

document.querySelector('main').prepend(hud);
// Screen sizing follows the inset opening in the cabinet artwork.

const modal = document.createElement('dialog');
modal.className = 'cf-results';
modal.setAttribute('aria-labelledby','cf-result-title');
modal.innerHTML = '<h2 id="cf-result-title" class="cf-winner">WINNER</h2><span id="cf-result-mult" hidden></span><div class="cf-breakdown"><div><span>FINAL SCORE</span><strong id="cf-final-score"></strong></div><div><span>HIGH SCORE</span><strong id="cf-best-score"></strong></div></div><div class="cf-pay-label">ROUND VALUE</div><div class="cf-pay"><span id="cf-final-money"></span></div><button id="cf-new-round" autofocus>NEW ROUND</button>';
document.body.append(modal);
const el = id => document.getElementById(id);
let shown = 0, previousTime = performance.now(), presented = false, endAt = null;
function newRound(){
  modal.close();modal.classList.remove('revealed');celebration=null;endAt=null;
  game.reset();
  release();
  shown = 0;
  presented = false;
  view.focus();
}
el('cf-new-round').addEventListener('click',newRound);
modal.addEventListener('cancel',event=>event.preventDefault());
window.addEventListener('keydown',event=>{
  if(!modal.open)return;
  if(inputCode(event)==='KeyR'){
    event.preventDefault();event.stopImmediatePropagation();newRound();
  } else if(['ArrowLeft','ArrowRight','Space','KeyA','KeyP'].includes(inputCode(event))){
    event.preventDefault();event.stopImmediatePropagation();
  }
},true);
function tick(now){
  const dt = Math.min((now-previousTime)/1000,.1);
  previousTime=now;
  if(g.score<shown || g.mode==='ready'&&g.score===0)shown=g.score;
  else shown+=(g.score-shown)*(1-Math.exp(-12*dt));
  if(Math.abs(g.score-shown)<.5)shown=g.score;
  if(g.mode==='over')shown=g.score;
  const displayed = Math.floor(shown);
  hud.classList.toggle('idle',g.mode==='ready'&&g.number===1&&!g.pendingBonus);
  el('cf-money').textContent=money(settings.tieredMode?g.score:displayed);
  el('cf-score').textContent=displayed.toString().padStart(6,'0')+' PTS';
  el('cf-best').textContent=g.best.toLocaleString('en-US');
  el('cf-ball').textContent=g.number+' / '+g.totalBalls;
  el('cf-multi').textContent=g.mult+'×';
  const remaining=g.mult>1?Math.max(0,Math.ceil(g.multUntil-g.time)):0;el('cf-multi-timer').hidden=!remaining;el('cf-multi-timer').textContent=remaining||'';
  el('cf-live-balls').textContent=g.balls.length>1?g.balls.length+' IN PLAY':'';
  el('cf-mode').textContent=g.auto?'AUTO FLIPPERS':'MANUAL';
  const held=g.balls.some(b=>b.held);
  el('cf-status').textContent=g.paused?'PAUSED':g.pendingBonus?'LAUNCH BONUS BALL':held?'TRAP RELEASE IN '+Math.max(0,Math.ceil(g.releaseAt-g.time))+'s':g.mode==='ready'?'READY TO LAUNCH':g.mode==='over'?'ROUND COMPLETE':g.time<g.extraAwardUntil?'EXTRA BALL AWARDED':g.balls.length>1?'MULTIBALL':g.time<g.noticeUntil?g.notice:g.balls.some(b=>b.route==='launch')?'LAUNCHING':g.balls.some(b=>b.route)?'RAMP RUN':'IN PLAY';
  hud.classList.toggle('bonus-prompt',g.pendingBonus&&!g.paused);
  el('cf-bonus-prompt').textContent=g.pendingBonus?'LAUNCH BONUS BALL':'';
  el('cf-bonus-countdown').textContent=g.pendingBonus?'SPACE / LAUNCH · AUTO IN '+Math.max(0,Math.ceil(g.bonusAt-g.time))+'s':'';
  el('launch').textContent=g.pendingBonus?'BONUS BALL':'LAUNCH';

  if(g.mode!=='over'){presented=false;endAt=null;celebration=null;}
  if(g.mode==='over'&&endAt===null){endAt=g.time;startCelebration();release();}

  if(g.mode==='over'&&!presented&&g.time-endAt>=2){
    presented=true;
    shown=g.score;
    release();
    el('cf-final-score').textContent=g.score.toLocaleString('en-US')+' PTS';
    el('cf-best-score').textContent=g.best.toLocaleString('en-US')+' PTS';
    el('cf-result-mult').textContent=g.mult+'× MULTIPLIER';
    el('cf-final-money').textContent=money(g.score);
    modal.showModal();
    requestAnimationFrame(()=>modal.classList.add('revealed'));
    el('cf-new-round').focus();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();


function applySettings(data){
 Object.assign(settings,normalizeSettings(data));
 g.auto=settings.defaultAutoplay;soundEnabled=settings.defaultSound;
 document.getElementById('sound').setAttribute('aria-pressed',String(soundEnabled));
 document.getElementById('sound').title=soundEnabled?'Sound on — click to mute':'Sound off — click to enable';
 if(!soundEnabled&&audioContext?.state==='running')audioContext.suspend().catch(()=>{});
 game.reset();g.best=0;release();celebration=null;
 const modal=document.querySelector('.cf-results');if(modal?.open)modal.close();
}
window.addEventListener('onWidgetLoad',event=>applySettings(event.detail?.fieldData||{}));

</script></body></html>
