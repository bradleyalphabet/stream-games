<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tricky's Catapult v2.1 — Interaction Preview</title>
  <style id="v2-widget-css">
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800;900&display=swap');

:root {
      --pink: #ff4fa9;
      --hot-pink: #ff168c;
      --pale-pink: #ffd1e6;
      --purple: #aa70ff;
      --silver: #e9ecf5;
      --ink: #351729;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Jost", Arial, sans-serif;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: 0 0;
      background: transparent;
    }

    #target {
      position: absolute;
      top: 25px;
      width: 224px;
      height: 224px;
      transform: translateX(-50%);
      transition: left 80ms linear, filter 180ms ease;
      pointer-events: none;
      opacity: .93;
      filter: drop-shadow(0 0 8px rgba(255, 72, 169, .38));
    }

    #target.flash {
      animation: targetFlash 540ms ease-out;
    }

    .target-svg { width: 100%; height: 100%; overflow: visible; }
    .ring {
      fill: rgba(255, 210, 233, .035);
      stroke: rgba(255, 230, 242, .9);
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 3px rgba(255, 85, 178, .92));
    }
    .ring.pink {
      stroke: rgba(255, 63, 159, .98);
      filter: drop-shadow(0 0 4px rgba(255, 48, 161, .98));
    }
    .ring.purple {
      stroke: rgba(181, 126, 255, .97);
      filter: drop-shadow(0 0 4px rgba(169, 104, 255, .98));
    }
    .crosshair {
      stroke: rgba(255, 217, 241, .78);
      stroke-width: 3.5;
      filter: drop-shadow(0 0 3px rgba(255, 77, 174, .88));
    }
    .ring-label {
      fill: #fff;
      font: 700 15px "Jost", Arial, sans-serif;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(76, 22, 54, .9);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    #impact-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: var(--hot-pink);
      box-shadow: 0 0 8px #fff, 0 0 22px var(--hot-pink);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 9;
    }

    #impact-dot.show {
      animation: impactPop 900ms ease-out forwards;
    }

    .impact-marker {
      position: absolute;
      z-index: 10;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--hot-pink);
      color: #fff;
      font: 900 12px/18px "Jost", Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 0 8px #fff, 0 0 22px var(--hot-pink);
      animation: impactPop 650ms ease-out forwards;
    }

    #amount {
      position: absolute;
      z-index: 12;
      min-width: 190px;
      transform: translate(-50%, -50%) scale(.25);
      opacity: 0;
      color: #fff;
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      letter-spacing: -3px;
      pointer-events: none;
      text-shadow:
        0 0 4px #fff,
        0 0 12px #fff,
        0 0 24px var(--pink),
        0 0 45px var(--hot-pink);
    }

    #amount.show {
      animation: amountIn 650ms cubic-bezier(.15, 1.25, .3, 1) forwards;
    }

    #desk-shadow {
      position: absolute;
      left: 50%;
      bottom: 95px;
      width: 520px;
      height: 110px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(45, 13, 33, .44), transparent 67%);
      pointer-events: none;
      transition: left 80ms linear;
    }

    #catapult {
      position: absolute;
      top: 684px;
      width: 330px;
      height: 260px;
      cursor: ew-resize;
      touch-action: none;
      z-index: 20;
      filter: drop-shadow(0 18px 18px rgba(38, 9, 28, .38));
    }

    #catapult.dragging { cursor: grabbing; }

    #catapult-art {
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 330px;
      height: 440px;
      object-fit: contain;
      object-position: center bottom;
      transform-origin: 50% 50%;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #sound-toggle {
      position: absolute;
      left: 213px;
      top: 121px;
      width: 38px;
      min-width: 0;
      height: 38px;
      margin: 0;
      padding: 0;
      z-index: 29;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    #sound-toggle::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,.42), rgba(255,75,183,.2) 48%, transparent 72%);
      box-shadow: 0 0 8px rgba(255,255,255,.75), 0 0 15px rgba(255,56,169,.65);
      transition: opacity 120ms ease;
      pointer-events: none;
    }

    #sound-toggle:hover,
    #sound-toggle:active,
    #sound-toggle:focus-visible {
      transform: none;
      filter: none;
      box-shadow: none;
      outline: none;
    }

    #sound-toggle:hover::after,
    #sound-toggle:focus-visible::after { opacity: .58; }

    .simp-state {
      position: absolute;
      object-fit: contain;
      object-position: center;
      transform-origin: 50% 55%;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #loaded-dummy {
      left: -5px;
      top: 70px;
      width: 110px;
      height: 118px;
      z-index: 24;
      opacity: 0;
      transition: opacity 60ms linear;
      filter: drop-shadow(0 5px 7px rgba(43,8,34,.42));
    }

    #flight-dummy {
      display: none;
      left: 0;
      top: 0;
      width: 140px;
      height: 190px;
      z-index: 30;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.8));
    }

    #figure-rack {
      position: absolute;
      top: 808px;
      width: 282px;
      height: 136px;
      transform: translateX(-50%);
      z-index: 31;
      transition: left 80ms linear;
    }

    .bench-figure {
      position: absolute;
      top: 3px;
      width: 82px;
      height: 126px;
      object-fit: contain;
      object-position: center bottom;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-drag: none;
      --flip: 1;
      transform: scaleX(var(--flip));
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .bench-figure:nth-child(1) { left: 6px; }
    .bench-figure:nth-child(2) { left: 100px; }
    .bench-figure:nth-child(3) { left: 194px; }
    .bench-figure:hover { transform: translateY(-8px) scale(1.06) scaleX(var(--flip)); }
    .bench-figure.used { opacity: 0; pointer-events: none; }
    .bench-figure.drag-source { opacity: .18; }

    .dragging-figure {
      position: absolute;
      width: 112px;
      height: 184px;
      object-fit: contain;
      object-position: center top;
      transform-origin: 50% 5%;
      z-index: 80;
      pointer-events: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px var(--pink));
    }

    #controls {
      position: absolute;
      top: 950px;
      width: 390px;
      transform: translateX(-50%);
      z-index: 40;
      text-align: center;
      transition: left 80ms linear;
    }

    #drag-note {
      margin-bottom: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 2px 3px #38152b, 0 0 12px var(--pink);
    }

    #round-status {
      margin-top: 8px;
      color: #eee7f0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-shadow: 0 2px 3px #38152b;
    }

    #round-status .status-number {
      color: #fff;
      font-weight: 900;
      text-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 13px rgba(255,105,183,.7);
    }

    button {
      height: 50px;
      margin: 0 5px;
      padding: 0 25px;
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 13px;
      background: linear-gradient(180deg, #ff77bc, #db267e);
      color: #fff;
      font: 900 18px "Jost", Arial, sans-serif;
      letter-spacing: 1.3px;
      cursor: pointer;
      box-shadow: 0 5px 0 #701f54, 0 0 17px rgba(255,40,145,.7), inset 0 3px 0 rgba(255,255,255,.33);
      text-shadow: 0 2px 2px rgba(69,12,46,.7);
    }

    button:hover { filter: brightness(1.14); }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #701f54, 0 0 14px rgba(255,40,145,.65); }
    button:disabled { cursor: default; filter: grayscale(.55); opacity: .65; }
    #launch-button {
      min-width: 170px;
      background: linear-gradient(135deg, #ff76ca 0%, #e536aa 43%, #8b52e7 100%);
      box-shadow:
        0 5px 0 #5d245f,
        0 0 10px rgba(255,255,255,.8),
        0 0 24px rgba(255,54,181,.92),
        0 0 42px rgba(142,77,235,.72),
        inset 0 3px 0 rgba(255,255,255,.38);
    }

    #launch-button:not(:disabled) {
      animation: launchGlow 1.35s ease-in-out infinite alternate;
    }
    #round-summary {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 510px;
      min-height: 360px;
      z-index: 120;
      transform: translate(-50%, -50%) scale(.7);
      padding: 34px 36px 38px;
      border: 4px solid rgba(255,255,255,.95);
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(58,20,48,.75), rgba(24,13,35,.75));
      box-shadow: 0 0 0 5px rgba(255,63,159,.48), 0 0 55px rgba(255,42,151,.7), inset 0 0 35px rgba(177,112,255,.24);
      color: #fff;
      text-align: center;
      opacity: 0;
      pointer-events: none;
    }

    #round-summary.show {
      animation: summaryIn 520ms cubic-bezier(.15,1.22,.3,1) forwards;
      pointer-events: auto;
    }

    #round-summary h2 {
      margin: 0 0 22px;
      color: #f0d7eb;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 13px rgba(229,54,170,.82);
    }

    #summary-shots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 18px;
    }

    .summary-shot {
      width: 126px;
      padding: 13px 8px;
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      font-size: 14px;
      letter-spacing: 1px;
    }

    .summary-shot strong {
      display: block;
      margin-top: 5px;
      font-size: 30px;
      color: #fff;
      text-shadow: 0 0 12px var(--pink);
    }

    #summary-total {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 13px;
      margin: 0;
      padding: 20px 0 30px;
      font-weight: 900;
      line-height: .95;
      color: #e536aa;
      text-shadow:
        0 0 12px rgba(229,54,170,.95),
        0 0 28px rgba(255,22,140,.82),
        0 0 50px rgba(139,82,231,.68);
    }

    #summary-total .pay-label {
      font-size: 29px;
      letter-spacing: 2px;
    }

    #summary-total .total-number {
      color: #fff;
      font-size: 82px;
      font-weight: 900;
      text-shadow:
        0 0 9px rgba(255,255,255,.92),
        0 0 26px rgba(255,105,183,.82),
        0 0 48px rgba(177,112,255,.7);
    }

    .particle {
      position: absolute;
      z-index: 11;
      width: var(--width, var(--size));
      height: var(--height, var(--size));
      left: var(--x);
      top: var(--y);
      border-radius: var(--radius);
      background: var(--color);
      color: var(--text-color, #6d347b);
      font: 900 14px "Jost", Arial, sans-serif;
      line-height: var(--height, var(--size));
      text-align: center;
      pointer-events: none;
      box-shadow: 0 0 8px var(--glow);
      animation: burst var(--duration) cubic-bezier(.12,.65,.25,1) var(--delay) forwards;
    }

    .particle.coin {
      border: 2px solid rgba(235,205,244,.82);
      background: radial-gradient(circle at 34% 28%, #f7d9ff 0 9%, #e4e7f2 20%, #aeb5c9 64%, #747c96 100%);
      box-shadow: 0 0 6px #d9b4ef, 0 0 13px rgba(197,118,242,.72);
    }

    .particle.diamond {
      border-radius: 2px;
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }

    .particle.shard { border-radius: 999px; }

    .particle.ring {
      border: 3px solid var(--color);
      background: transparent;
      box-shadow: 0 0 6px var(--glow), inset 0 0 6px var(--glow);
    }

    .particle.star {
      border-radius: 0;
      clip-path: polygon(50% 0, 61% 36%, 100% 38%, 68% 59%, 79% 100%, 50% 75%, 21% 100%, 32% 59%, 0 38%, 39% 36%);
    }

    .firework-particle {
      position: absolute;
      z-index: 12;
      left: var(--x);
      top: var(--y);
      width: var(--length);
      height: 4px;
      border-radius: 999px;
      transform-origin: 0 50%;
      transform: rotate(var(--angle)) translateX(5px) scaleX(.2);
      background: linear-gradient(90deg, #f3bdf6 0%, var(--color) 38%, transparent 100%);
      box-shadow: 0 0 7px #efb6fb, 0 0 14px var(--color), 0 0 24px var(--color);
      opacity: 0;
      pointer-events: none;
      animation: fireworkBurst var(--duration) cubic-bezier(.1,.62,.28,1) var(--delay) forwards;
    }

    @keyframes launchGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.18) saturate(1.16); }
    }

    @keyframes fireworkBurst {
      0% { opacity: 0; transform: rotate(var(--angle)) translateX(5px) scaleX(.15); }
      14% { opacity: 1; }
      70% { opacity: .92; }
      100% { opacity: 0; transform: rotate(var(--angle)) translateX(var(--distance)) scaleX(1); }
    }

    @keyframes targetFlash {
      0% { filter: drop-shadow(0 0 8px rgba(255,72,169,.38)); }
      25% { filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 32px #ff3e9f); }
      100% { filter: drop-shadow(0 0 8px rgba(255,72,169,.38)); }
    }

    @keyframes impactPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1.55); }
      55% { opacity: 1; transform: translate(-50%, -50%) scale(.86); }
      100% { opacity: .85; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes amountIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.25); }
      64% { opacity: 1; transform: translate(-50%, -50%) scale(1.17); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes summaryIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(-50%, -50%) translate(0,0) rotate(0) scale(.4); }
      68% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) rotate(var(--spin)) scale(1); }
    }

    html, body {
      background: #171419;
    }

    #viewport {
      background: linear-gradient(135deg, #4b424f 0%, #332c37 48%, #171419 100%);
    }

    #stage {
      background: transparent;
    }
  </style>
</head>
<body>
<div id="viewport">
    <div id="stage">
<div id="target" aria-label="Payout target">
        <svg class="target-svg" viewBox="0 0 224 224" aria-hidden="true">
          <circle class="ring pink" cx="112" cy="112" r="90" />
          <circle class="ring" cx="112" cy="112" r="65" />
          <circle class="ring purple" cx="112" cy="112" r="40" />
          <circle class="ring pink" cx="112" cy="112" r="18" />
          <line class="crosshair" x1="112" y1="12" x2="112" y2="212" />
          <line class="crosshair" x1="12" y1="112" x2="212" y2="112" />
          <text class="ring-label" x="112" y="17">$5</text>
          <text class="ring-label" x="112" y="45">$10</text>
          <text class="ring-label" x="112" y="73">$15</text>
          <text class="ring-label" x="112" y="117">$25</text>
        </svg>
      </div>

      <div id="impact-dot"></div>
      <div id="amount">$5</div>
      <div id="desk-shadow"></div>

      <div id="catapult" aria-label="Drag catapult side to side">
        <img id="catapult-art" alt="Catapult" draggable="false">
        <img id="loaded-dummy" class="simp-state" alt="Loaded figure" draggable="false">
        <button id="sound-toggle" type="button" title="Sound" aria-label="Sound" aria-pressed="false"></button>
      </div>

      <img id="flight-dummy" class="simp-state" alt="Flying figure" draggable="false">

      <div id="figure-rack" aria-label="Figures remaining">
        <img class="bench-figure" data-figure="0" alt="Figure 1" draggable="false">
        <img class="bench-figure" data-figure="1" alt="Figure 2" draggable="false">
        <img class="bench-figure" data-figure="2" alt="Figure 3" draggable="false">
      </div>

      <div id="controls">
        <div id="drag-note">DRAG SIMP TO LOAD</div>
        <button id="launch-button" disabled>LAUNCH</button>
        <div id="round-status">SHOT <span class="status-number">1</span> OF <span class="status-number">3</span> · TOTAL <span class="status-number">$0</span></div>
      </div>

      <div id="round-summary" role="dialog" aria-modal="true" aria-label="Round results">
        <h2>RESULTS</h2>
        <div id="summary-shots"></div>
        <div id="summary-total"><span class="pay-label">PAY</span><span class="total-number">$0</span></div>
        <button id="new-round-button">NEW ROUND</button>
      </div>
    </div>
  </div>
  <script>
(() => {
      const W = 1920;
      const H = 1080;
      const TARGET_Y = 137;
      const TARGET_WIDTH = 224;
      const TARGET_OFFSET = TARGET_WIDTH * 1.5;
      const CATAPULT_Y = 810;
      const CAT_WIDTH = 330;
      const MIN_CENTER_X = 600;
      const MAX_CENTER_X = 1380;
      const FLIGHT_MS = 1120;
      const settings = { soundDefault: false };

      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const target = document.getElementById('target');
      const catapult = document.getElementById('catapult');
      const catapultArt = document.getElementById('catapult-art');
      const soundToggle = document.getElementById('sound-toggle');
      const deskShadow = document.getElementById('desk-shadow');
      const figureRack = document.getElementById('figure-rack');
      const benchFigures = [...document.querySelectorAll('.bench-figure')];
      const controls = document.getElementById('controls');
      const launchButton = document.getElementById('launch-button');
      const dragNote = document.getElementById('drag-note');
      const roundStatus = document.getElementById('round-status');
      const loadedDummy = document.getElementById('loaded-dummy');
      const flightDummy = document.getElementById('flight-dummy');
      const impactDot = document.getElementById('impact-dot');
      const amount = document.getElementById('amount');
      const roundSummary = document.getElementById('round-summary');
      const summaryShots = document.getElementById('summary-shots');
      const summaryTotal = document.getElementById('summary-total');

      const tossAudioGoofy = new Audio(soundSources.tossGoofy);

      const tossAudio4 = new Audio(soundSources.toss4);

      const allAudio = [tossAudioGoofy, tossAudio2, tossAudio3, tossAudio4, impactAudio1, impactAudio2];
      allAudio.forEach(audio => { audio.preload = 'auto'; });

      function randomFrom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function nextEarlyTossAudio() {
        const pool = [tossAudio2, tossAudio3, tossAudio4];
        const choices = previousEarlyTossAudio
          ? pool.filter(audio => audio !== previousEarlyTossAudio)
          : pool;
        const selected = randomFrom(choices);
        previousEarlyTossAudio = selected;
        return selected;
      }

      function stopAudio() {
        allAudio.forEach(audio => {
          audio.pause();
          audio.currentTime = 0;
        });
      }

      function playAudio(audio, volume) {
        if (!soundEnabled) return;
        audio.pause();
        audio.currentTime = 0;
        audio.volume = volume;
        const playback = audio.play();
        if (playback && typeof playback.catch === 'function') playback.catch(() => {});
      }

      function updateSoundToggle() {
        soundToggle.setAttribute('aria-pressed', String(soundEnabled));
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        if (!soundEnabled) stopAudio();
        updateSoundToggle();
      }

      function shuffledIndexes(length = lineupImages.length) {
        const values = Array.from({ length }, (_, index) => index);
        for (let i = values.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [values[i], values[j]] = [values[j], values[i]];
        }
        return values;
      }

      function resize() {
        stageScale = Math.min(viewport.clientWidth / W, viewport.clientHeight / H);
        const left = (viewport.clientWidth - W * stageScale) / 2;
        const top = (viewport.clientHeight - H * stageScale) / 2;
        stage.style.transform = `translate(${left}px, ${top}px) scale(${stageScale})`;
      }

      function placeRig() {
        catapult.style.left = `${catCenterX - CAT_WIDTH / 2}px`;
        deskShadow.style.left = `${catCenterX}px`;
        targetCenterX = catCenterX + (catCenterX <= W / 2 ? TARGET_OFFSET : -TARGET_OFFSET);
        target.style.left = `${targetCenterX}px`;
        controls.style.left = `${catCenterX}px`;
        const onRight = catCenterX > W / 2;
        figureRack.style.left = `${catCenterX + (onRight ? 290 : -290)}px`;
        catapultArt.style.transform = `scaleX(${onRight ? -1 : 1})`;
        soundToggle.style.left = onRight ? '81px' : '213px';
        loadedDummy.style.left = onRight ? '225px' : '-5px';
        loadedDummy.style.transform = `scaleX(${onRight ? -1 : 1}) scale(var(--load-scale, 1))`;
      }

      function setCatapultFrame(frameNumber) {
        catapultArt.src = catapultFrames[frameNumber - 1];
      }

      function playCatapultSequence() {
        setCatapultFrame(1);
        [2, 3, 4, 5].forEach((frameNumber, index) => {
          setTimeout(() => {
            setCatapultFrame(frameNumber);
            if (frameNumber === 2) loadedDummy.style.opacity = '0';
          }, 58 * (index + 1));
        });
      }

      function playCatapultReverse(onComplete) {
        [4, 3, 2, 1].forEach((frameNumber, index) => {
          const timer = setTimeout(() => {
            setCatapultFrame(frameNumber);
            if (frameNumber === 1 && onComplete) onComplete();
          }, 64 * (index + 1));
          settleTimers.push(timer);
        });
      }

      function stageXFromEvent(event) {
        const rect = stage.getBoundingClientRect();
        return (event.clientX - rect.left) / stageScale;
      }

      function stagePointFromEvent(event) {
        const rect = stage.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) / stageScale,
          y: (event.clientY - rect.top) / stageScale
        };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applySettings(fieldData = {}) {
        settings.soundDefault = fieldData.soundDefault === undefined
          ? false
          : fieldData.soundDefault === true || fieldData.soundDefault === 'true';
        soundEnabled = settings.soundDefault;
        if (!soundEnabled) stopAudio();
        updateSoundToggle();
      }

      function shuffleLineup() {
        const order = shuffledIndexes();
        benchFigures.forEach((figure, slot) => {
          figure.src = lineupImages[order[slot]];
          figure.style.setProperty('--flip', Math.random() < .5 ? -1 : 1);
        });
      }

      function payoutForRadius(radius) {
        if (radius <= 18) return 25;
        if (radius <= 40) return 15;
        if (radius <= 65) return 10;
        return 5;
      }

      function randomImpact() {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * 88;
        return {
          dx: Math.cos(angle) * radius,
          dy: Math.sin(angle) * radius,
          radius,
          payout: payoutForRadius(radius)
        };
      }

      function clearEffects() {
        document.querySelectorAll('.particle, .firework-particle').forEach(p => p.remove());
        impactDot.classList.remove('show');
        amount.classList.remove('show');
        amount.style.opacity = '0';
        target.classList.remove('flash');
      }

      function clearTransientEffects() {
        settleTimers.forEach(timer => clearTimeout(timer));
        settleTimers = [];
        clearEffects();
        launched = false;
        inFlight = false;
        flightDummy.style.display = 'none';
        flightDummy.style.opacity = '1';
        flightDummy.style.transition = 'none';
        flightDummy.style.zIndex = '30';
        setCatapultFrame(1);
        launchButton.style.display = 'inline-block';
      }

      function updateRoundStatus() {
        const total = shotResults.reduce((sum, value) => sum + value, 0);
        const nextShot = Math.min(shotResults.length + 1, 3);
        roundStatus.innerHTML = `SHOT <span class="status-number">${nextShot}</span> OF <span class="status-number">3</span> · TOTAL <span class="status-number">$${total}</span>`;
      }

      function loadFigure(index) {
        if (inFlight || roundOver || needsReset || loadedFigureIndex !== null) return;
        clearTransientEffects();
        loadedFigureIndex = index;
        benchFigures[index].classList.add('used');
        const loadIndex = Math.floor(Math.random() * loadImages.length);
        loadedDummy.src = loadImages[loadIndex];
        loadedDummy.style.setProperty('--load-scale', loadIndex === 2 ? .8 : 1);
        loadedDummy.style.opacity = '1';
        launchButton.disabled = false;
        dragNote.textContent = 'DRAG TO AIM';
        placeRig();
      }

      function autoResetBetweenLoads() {
        if (!needsReset || roundOver) return;
        clearEffects();
        launched = false;
        inFlight = false;
        flightDummy.style.display = 'none';
        flightDummy.style.opacity = '1';
        flightDummy.style.transition = 'none';
        flightDummy.style.zIndex = '30';
        loadedFigureIndex = null;
        loadedDummy.style.opacity = '0';
        launchButton.style.display = 'inline-block';
        launchButton.disabled = true;
        dragNote.textContent = 'RESETTING';
        playCatapultReverse(() => {
          needsReset = false;
          dragNote.textContent = 'DRAG SIMP TO LOAD';
        });
      }

      function resetRound() {
        clearTransientEffects();
        shotResults = [];
        previousEarlyTossAudio = null;
        loadedFigureIndex = null;
        roundOver = false;
        needsReset = false;
        loadedDummy.style.opacity = '0';
        launchButton.disabled = true;
        dragNote.textContent = 'DRAG SIMP TO LOAD';
        roundSummary.classList.remove('show');
        document.querySelectorAll('.impact-marker').forEach(marker => marker.remove());
        benchFigures.forEach(figure => figure.classList.remove('used', 'drag-source'));
        shuffleLineup();
        updateRoundStatus();
      }

      function burstAt(x, y) {
        const colors = ['#ff3fa4', '#ff79ca', '#dc54ea', '#b776ff', '#8758e8', '#c8a4dc', '#9da8c6'];
        const particleTypes = ['pixel', 'diamond', 'shard', 'ring', 'star'];
        for (let i = 0; i < 54; i++) {
          const p = document.createElement('div');
          const coin = i % 7 === 0;
          const type = coin ? 'coin' : particleTypes[i % particleTypes.length];
          const angle = Math.random() * Math.PI * 2;
          const distance = 48 + Math.random() * 162;
          const size = coin ? 25 + Math.random() * 10 : 5 + Math.random() * 13;
          const color = randomFrom(colors);
          p.className = `particle ${type}`;
          p.textContent = coin ? '$' : '';
          p.style.setProperty('--x', `${x}px`);
          p.style.setProperty('--y', `${y}px`);
          p.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
          p.style.setProperty('--dy', `${Math.sin(angle) * distance + 35}px`);
          p.style.setProperty('--spin', `${-220 + Math.random() * 440}deg`);
          p.style.setProperty('--size', `${size}px`);
          p.style.setProperty('--width', `${type === 'shard' ? size * 2.5 : size}px`);
          p.style.setProperty('--height', `${type === 'shard' ? Math.max(3, size * .28) : size}px`);
          p.style.setProperty('--radius', coin || type === 'ring' ? '50%' : (Math.random() < .5 ? '1px' : '4px'));
          p.style.setProperty('--color', color);
          p.style.setProperty('--glow', color);
          p.style.setProperty('--text-color', '#713b83');
          p.style.setProperty('--duration', `${650 + Math.random() * 520}ms`);
          p.style.setProperty('--delay', `${Math.random() * 75}ms`);
          stage.appendChild(p);
          setTimeout(() => p.remove(), 1350);
        }

        const fireworkColors = ['#ff42b5', '#f36cff', '#ad67ff', '#7b4ee8'];
        for (let i = 0; i < 28; i++) {
          const spark = document.createElement('div');
          const angle = (360 / 28) * i + (-4 + Math.random() * 8);
          spark.className = 'firework-particle';
          spark.style.setProperty('--x', `${x}px`);
          spark.style.setProperty('--y', `${y}px`);
          spark.style.setProperty('--angle', `${angle}deg`);
          spark.style.setProperty('--distance', `${70 + Math.random() * 115}px`);
          spark.style.setProperty('--length', `${28 + Math.random() * 32}px`);
          spark.style.setProperty('--color', randomFrom(fireworkColors));
          spark.style.setProperty('--duration', `${520 + Math.random() * 380}ms`);
          spark.style.setProperty('--delay', `${Math.random() * 65}ms`);
          stage.appendChild(spark);
          setTimeout(() => spark.remove(), 1100);
        }
      }

      function showRoundSummary() {
        summaryShots.replaceChildren();
        shotResults.forEach((value, index) => {
          const card = document.createElement('div');
          card.className = 'summary-shot';
          card.innerHTML = `SHOT ${index + 1}<strong>$${value}</strong>`;
          summaryShots.appendChild(card);
        });
        const total = shotResults.reduce((sum, value) => sum + value, 0);
        summaryTotal.innerHTML = `<span class="pay-label">PAY</span><span class="total-number">$${total}</span>`;
        roundSummary.classList.remove('show');
        void roundSummary.offsetWidth;
        roundSummary.classList.add('show');
      }

      function holdAndSlideFigure(endY) {
        flightDummy.style.zIndex = '10';
        flightDummy.style.opacity = '1';
        flightDummy.style.transition = 'none';
        settleTimers.push(setTimeout(() => {
          flightDummy.style.transition = 'top 720ms cubic-bezier(.35,.02,.65,1), opacity 720ms ease-in';
          flightDummy.style.top = `${endY + 34}px`;
          flightDummy.style.opacity = '0';
        }, 380));
        settleTimers.push(setTimeout(() => {
          flightDummy.style.display = 'none';
        }, 1140));
      }

      function showResult(x, y, payout) {
        const shotNumber = shotResults.length + 1;
        const marker = document.createElement('div');
        marker.className = 'impact-marker';
        marker.textContent = shotNumber;
        marker.style.left = `${x}px`;
        marker.style.top = `${y}px`;
        stage.appendChild(marker);

        target.classList.remove('flash');
        void target.offsetWidth;
        target.classList.add('flash');

        burstAt(x, y);
        playAudio(randomFrom([impactAudio1, impactAudio1, impactAudio2]), .86);

        amount.textContent = `$${payout}`;
        amount.style.left = `${x}px`;
        amount.style.top = `${y + 82}px`;
        amount.classList.remove('show');
        void amount.offsetWidth;
        amount.classList.add('show');

        shotResults.push(payout);
        loadedFigureIndex = null;
        launchButton.style.display = 'none';
        launchButton.disabled = true;
        launched = true;
        updateRoundStatus();

        if (shotResults.length === 3) {
          roundOver = true;
          dragNote.textContent = 'FINAL TOTAL';
          setTimeout(showRoundSummary, 1150);
        } else {
          needsReset = true;
          dragNote.textContent = `SHOT ${shotNumber}: $${payout}`;
          settleTimers.push(setTimeout(autoResetBetweenLoads, 1300));
        }
      }

      function launch() {
        if (inFlight || launched || roundOver || loadedFigureIndex === null) return;
        inFlight = true;
        launchButton.disabled = true;
        dragNote.textContent = 'INCOMING';
        clearEffects();

        const tossAudio = shotResults.length === 2
          ? tossAudioGoofy
          : nextEarlyTossAudio();
        playAudio(tossAudio, .72);

        const hit = randomImpact();
        const onRight = catCenterX > W / 2;
        const startX = catCenterX + (onRight ? 120 : -120);
        const startY = CATAPULT_Y + 8;
        const endX = targetCenterX + hit.dx;
        const endY = TARGET_Y + hit.dy;
        const curveX = (startX + endX) / 2 + (-70 + Math.random() * 140);
        const curveY = 430 + Math.random() * 80;
        const rotation = (Math.random() < .5 ? -1 : 1) * (500 + Math.random() * 380);

        flightDummy.src = randomFrom(flingImages);
        playCatapultSequence();
        flightDummy.style.display = 'none';
        const startTime = performance.now();

        function frame(now) {
          flightDummy.style.display = 'block';
          const t = clamp((now - startTime) / FLIGHT_MS, 0, 1);
          const eased = 1 - Math.pow(1 - t, 2.45);
          const inv = 1 - eased;
          const x = inv * inv * startX + 2 * inv * eased * curveX + eased * eased * endX;
          const y = inv * inv * startY + 2 * inv * eased * curveY + eased * eased * endY;
          const scale = 1 - eased * .73;
          const squash = t > .91 ? 1 - ((t - .91) / .09) * .22 : 1;
          flightDummy.style.left = `${x - 70}px`;
          flightDummy.style.top = `${y - 95}px`;
          flightDummy.style.transform = `rotate(${rotation * eased}deg) scale(${scale * (1.15 - squash * .15)}, ${scale * squash})`;

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            inFlight = false;
            showResult(endX, endY, hit.payout);
            holdAndSlideFigure(endY);
          }
        }

        setTimeout(() => requestAnimationFrame(frame), 105);
      }

      function moveFigureGhost(event) {
        if (!figureDrag || event.pointerId !== figureDrag.pointerId) return;
        const point = stagePointFromEvent(event);
        const now = performance.now();
        const elapsed = Math.max(8, now - figureDrag.lastTime);
        const cursorVelocity = (point.x - figureDrag.lastX) / elapsed * 16.67;
        figureDrag.drive = clamp(-cursorVelocity * 2.2, -34, 34);
        figureDrag.lastX = point.x;
        figureDrag.lastTime = now;
        figureDrag.ghost.style.left = `${point.x - 56}px`;
        figureDrag.ghost.style.top = `${point.y - 24}px`;
      }

      function animateFigureSwing() {
        if (!figureDrag) return;
        figureDrag.drive *= .84;
        figureDrag.swing += (figureDrag.drive - figureDrag.swing) * .2;
        figureDrag.ghost.style.transform = `rotate(${figureDrag.swing}deg) scaleX(${figureDrag.flip})`;
        figureDrag.swingFrame = requestAnimationFrame(animateFigureSwing);
      }

      function finishFigureDrag(event, cancelled = false) {
        if (!figureDrag || event.pointerId !== figureDrag.pointerId) return;
        const point = stagePointFromEvent(event);
        const onRight = catCenterX > W / 2;
        const basketX = catCenterX + (onRight ? 120 : -120);
        const basketY = CATAPULT_Y + 8;
        const closeEnough = Math.hypot(point.x - basketX, point.y - basketY) < 145;
        const inDropLane = Math.abs(point.x - basketX) < 190 && point.y >= 60 && point.y < basketY + 10;
        const { source, ghost, index, flip, swingFrame } = figureDrag;
        cancelAnimationFrame(swingFrame);
        if (source.hasPointerCapture(event.pointerId)) source.releasePointerCapture(event.pointerId);
        figureDrag = null;

        if (cancelled || (!closeEnough && !inDropLane)) {
          source.classList.remove('drag-source');
          ghost.remove();
          return;
        }

        if (closeEnough) {
          source.classList.remove('drag-source');
          ghost.remove();
          loadFigure(index);
          return;
        }

        figureDropping = true;
        const dropDuration = clamp((basketY - point.y) * .58, 220, 560);
        ghost.style.transition = `left ${dropDuration}ms linear, top ${dropDuration}ms cubic-bezier(.4, 0, 1, 1), transform ${dropDuration}ms ease-in`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.left = `${basketX - 56}px`;
            ghost.style.top = `${basketY - 24}px`;
            ghost.style.transform = `rotate(0deg) scaleX(${flip})`;
          });
        });
        setTimeout(() => {
          source.classList.remove('drag-source');
          ghost.remove();
          figureDropping = false;
          loadFigure(index);
        }, dropDuration + 25);
      }

      benchFigures.forEach((figure, index) => {
        figure.addEventListener('pointerdown', event => {
          if (inFlight || figureDropping || roundOver || needsReset || loadedFigureIndex !== null || figure.classList.contains('used')) return;
          event.preventDefault();
          const point = stagePointFromEvent(event);
          const ghost = document.createElement('img');
          ghost.src = randomFrom(liftImages);
          ghost.alt = 'Lifted figure';
          ghost.draggable = false;
          ghost.className = 'dragging-figure';
          const flip = Math.random() < .5 ? -1 : 1;
          ghost.style.transform = `scaleX(${flip})`;
          ghost.style.left = `${point.x - 56}px`;
          ghost.style.top = `${point.y - 24}px`;
          stage.appendChild(ghost);
          figure.classList.add('drag-source');
          figure.setPointerCapture(event.pointerId);
          figureDrag = {
            source: figure,
            ghost,
            index,
            pointerId: event.pointerId,
            flip,
            drive: 0,
            swing: 0,
            swingFrame: 0,
            lastX: point.x,
            lastTime: performance.now()
          };
          figureDrag.swingFrame = requestAnimationFrame(animateFigureSwing);
        });
      });

      catapult.addEventListener('pointerdown', event => {
        if (inFlight || figureDropping || launched) return;
        dragging = true;
        dragOffset = stageXFromEvent(event) - catCenterX;
        catapult.classList.add('dragging');
        catapult.setPointerCapture(event.pointerId);
      });

      catapult.addEventListener('pointermove', event => {
        if (!dragging || inFlight || launched) return;
        catCenterX = clamp(stageXFromEvent(event) - dragOffset, MIN_CENTER_X, MAX_CENTER_X);
        placeRig();
      });

      function stopDrag(event) {
        if (!dragging) return;
        dragging = false;
        catapult.classList.remove('dragging');
        if (event && catapult.hasPointerCapture(event.pointerId)) catapult.releasePointerCapture(event.pointerId);
      }

      catapult.addEventListener('pointerup', stopDrag);
      catapult.addEventListener('pointercancel', stopDrag);
      launchButton.addEventListener('click', launch);
      soundToggle.addEventListener('pointerdown', event => event.stopPropagation());
      soundToggle.addEventListener('click', event => {
        event.stopPropagation();
        toggleSound();
      });
      newRoundButton.addEventListener('click', resetRound);
      window.addEventListener('pointermove', moveFigureGhost);
      window.addEventListener('pointerup', event => finishFigureDrag(event));
      window.addEventListener('pointercancel', event => finishFigureDrag(event, true));
      window.addEventListener('resize', resize);
      window.addEventListener('onWidgetLoad', event => {
        applySettings(event.detail && event.detail.fieldData ? event.detail.fieldData : {});
        resetRound();
      });

      [...catapultFrames, ...lineupImages, ...liftImages, ...loadImages, ...flingImages].forEach(src => {
        const preload = new Image();
        preload.src = src;
      });
      catapultArt.src = catapultFrames[0];
      applySettings();
      placeRig();
      resetRound();
      resize();
    })();
  </script>
</body>
</html>
