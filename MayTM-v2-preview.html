  /* outer bloom cast by the machine's own neon edge — half the previous spread */

    drop-shadow(0 0 3px rgba(255,45,149,.95))
    drop-shadow(0 0 8px rgba(255,45,149,.9))
    drop-shadow(0 0 16px rgba(255,45,149,.75))
    drop-shadow(0 2px 19px rgba(255,45,149,.55))
    drop-shadow(0 6px 37px rgba(255,20,120,.40));
  /* bloom swaps to purple while the leaderboard is open */
  --edge-glow-purple:
    drop-shadow(0 0 3px rgba(190,90,255,1))
    drop-shadow(0 0 8px rgba(180,70,255,.95))
    drop-shadow(0 0 16px rgba(168,60,255,.85))
    drop-shadow(0 2px 19px rgba(140,40,240,.65))

  position:relative;

  font-family:'Chakra Petch',system-ui,sans-serif;
  user-select:none;
}
#stage{position:absolute;inset:0}

/* ---- layer order ------------------------------------------------ */
#eyes    {position:absolute;inset:0;z-index:1}   /* BEHIND the artwork */
/* Glow copy sits UNDER the eyes. Putting the filter on #chassis itself
   would bleed the pink shadow through the transparent eye holes. */
#glow    {position:absolute;inset:0;z-index:0;width:100%;height:100%;
          pointer-events:none;display:block;filter:var(--edge-glow);
          transition:filter .3s}
#atm-root.board-open #glow{filter:var(--edge-glow-purple)}
#chassis {position:absolute;inset:0;z-index:2;width:100%;height:100%;
          pointer-events:none;display:block}
#ui      {position:absolute;inset:0;z-index:3}   /* on top of artwork  */
#cash    {position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
#particles{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.spark{position:absolute;border-radius:50%;will-change:transform,opacity}
#toasts  {position:absolute;z-index:7;pointer-events:none;
          display:flex;align-items:center;justify-content:center}
#receipt {z-index:6}
#board   {z-index:8}

/* ---- eyes (seen through the two cut-outs) ----------------------- */
.eye{
  position:absolute; border-radius:50%;
  /* soft sphere: highlight upper-left, dark purple falling away lower-right */
  background:
    radial-gradient(circle at 34% 26%,
      #f4eefa 0%, #e8dff2 28%, #d2c2e4 54%, #ad96c7 76%, #78589f 100%);
  box-shadow:
    inset -11px -13px 26px rgba(56,16,86,.55),
    inset -3px  -4px 10px rgba(38,8,62,.42),
    inset  9px  10px 20px rgba(255,255,255,.42);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden; transition:opacity .25s;
}
.pupil{
  width:34%;height:37%;border-radius:50%;background:var(--pupil);
  will-change:transform;                      /* driven per-frame from JS */
  transition:background .25s,opacity .15s;
}
/* static specular highlight — sits above the pupil, never moves with it */
.spec{
  position:absolute; left:19%; top:15%;
  width:23%; height:21%; border-radius:50%;
  background:radial-gradient(circle at 44% 40%,
    #ffffff 0%, #ffffff 46%,
    rgba(255,255,255,.60) 72%, rgba(255,255,255,0) 100%);
  pointer-events:none;
}
/* success spiral — sits behind the pupil, spins for a beat */
.spiral{
  position:absolute;inset:-46%;border-radius:50%;
  background:var(--spiral) center/contain no-repeat;
  opacity:0;transition:opacity .18s;pointer-events:none;
}
@keyframes spinEye{to{transform:rotate(360deg)}}

/* red shading overlay (left red jewel) — sits BEHIND the pupil/spiral
   (no z-index: ::before paints first in source order, so it stacks
   under spiral/pupil automatically), dialed back so it reads as
   tired/bloodshot rather than a demonic stare */
.eye::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 62% 72%,rgba(255,42,55,.26),rgba(130,12,28,.12) 57%,transparent 77%),
    radial-gradient(ellipse at 23% 78%,rgba(180,18,35,.10),transparent 48%);
  opacity:0;transition:opacity .35s;pointer-events:none;
}
#atm-root.redeyes .eye::before{opacity:1}
#atm-root.very-redeyes .eye::before{
  opacity:1;
  background:
    radial-gradient(circle at 62% 72%,rgba(255,35,50,.52),rgba(135,5,24,.28) 58%,transparent 80%),
    radial-gradient(ellipse at 23% 78%,rgba(200,10,30,.25),transparent 52%);
  box-shadow:inset 0 0 17px rgba(180,8,28,.24);
}

.lid{
  position:absolute;inset:-2%;background:#3a1550;
  transform:scaleY(0);transform-origin:top;
}
#atm-root.blink .lid{animation:blink .17s ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
.eye .glyph{
  position:absolute;font-family:'Bungee',sans-serif;font-size:34px;
  color:var(--gold);text-shadow:0 0 8px rgba(255,212,71,.9),0 0 17px rgba(255,212,71,.58);opacity:0;transition:opacity .15s;
}
.eye .glyph.dead{
  font-weight:900;
  -webkit-text-stroke:1.4px currentColor;
  text-shadow:0 0 5px currentColor,0 0 14px rgba(255,43,61,.8);
}
#atm-root.s-armed      .pupil{background:var(--neon);box-shadow:0 0 14px var(--neon)}
#atm-root.s-declined   .pupil{opacity:0}
#atm-root.s-declined   .glyph.dead{opacity:1;color:var(--danger)}
/* random failure message: Xs become centred red pupils until idle */
#atm-root.s-declined.fup .pupil{
  opacity:1;background:var(--danger);
  box-shadow:0 0 7px var(--danger),0 0 17px rgba(255,43,61,.82);
}
#atm-root.s-declined.fup .glyph.dead{opacity:0}
/* success: spiral spins behind the pupils instead of the red stare */
#atm-root.s-smashed .spiral,
#atm-root.s-dispensing .spiral{opacity:.92;animation:spinEye 4.4s linear infinite}
#atm-root.s-smashed .eye{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}

/* low continuous vibration while the dispenser motor is running */
#atm-root.s-dispensing{animation:dispensingShake .13s linear infinite}
@keyframes dispensingShake{
  0%,100%{transform:scale(var(--scale)) translate(0,0) rotate(0deg)}
  25%{transform:scale(var(--scale)) translate(-.7px,.35px) rotate(-.08deg)}
  50%{transform:scale(var(--scale)) translate(.55px,-.25px) rotate(.06deg)}
  75%{transform:scale(var(--scale)) translate(-.25px,.45px) rotate(-.04deg)}
}

/* one excited double-hop as the dispenser celebration begins, then the
   regular low motor vibration takes over for the remainder of the payout */
#atm-root.s-dispensing.dispense-jump{
  animation:dispensingJump .72s cubic-bezier(.22,.78,.28,1);
}
@keyframes dispensingJump{
  0%,100%{transform:scale(var(--scale)) translate(0,0) rotate(0deg)}
  16%{transform:scale(var(--scale)) translate(0,2px) rotate(0deg)}
  38%{transform:scale(var(--scale)) translate(-1px,-14px) rotate(-.12deg)}
  56%{transform:scale(var(--scale)) translate(1px,2px) rotate(.10deg)}
  74%{transform:scale(var(--scale)) translate(0,-5px) rotate(-.05deg)}
  90%{transform:scale(var(--scale)) translate(0,1px) rotate(0deg)}
}

/* final payout punctuation: one clean celebratory jump as the gold
   firework fires and the receipt arrives */
#atm-root.dispense-final-jump{
  animation:dispenseFinalJump .68s cubic-bezier(.22,.78,.28,1);
}
@keyframes dispenseFinalJump{
  0%,100%{transform:scale(var(--scale)) translate(0,0) rotate(0deg)}
  18%{transform:scale(var(--scale)) translate(0,2px) rotate(0deg)}
  48%{transform:scale(var(--scale)) translate(0,-18px) rotate(0deg)}
  72%{transform:scale(var(--scale)) translate(0,3px) rotate(0deg)}
  86%{transform:scale(var(--scale)) translate(0,-3px) rotate(0deg)}
}

/* stronger approval shake, fired as VERIFYING resolves to APPROVED */
#atm-root.verified-shake{animation:verifiedShake .82s cubic-bezier(.36,.07,.19,.97)}
@keyframes verifiedShake{
  0%,100%{transform:scale(var(--scale)) translate(0,0) rotate(0deg)}
  8%{transform:scale(var(--scale)) translate(0,3px) rotate(0deg)}
  24%{transform:scale(var(--scale)) translate(-1px,-18px) rotate(-.18deg)}
  34%{transform:scale(var(--scale)) translate(1px,-22px) rotate(.18deg)}
  54%{transform:scale(var(--scale)) translate(0,4px) rotate(0deg)}
  68%{transform:scale(var(--scale)) translate(-1px,-7px) rotate(-.1deg)}
  82%{transform:scale(var(--scale)) translate(1px,2px) rotate(.08deg)}
  92%{transform:scale(var(--scale)) translate(0,-2px) rotate(0deg)}
}

/* compact decline reaction: one unhappy shudder, then hold */
#atm-root.declined-shake{animation:declinedShake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes declinedShake{
  0%,100%{transform:scale(var(--scale)) translate(0,0) rotate(0deg)}
  22%{transform:scale(var(--scale)) translate(-2px,0) rotate(-.25deg)}
  45%{transform:scale(var(--scale)) translate(2px,1px) rotate(.25deg)}
  68%{transform:scale(var(--scale)) translate(-1px,0) rotate(-.12deg)}
}

/* ---- title plate ------------------------------------------------ */
#title{
  position:absolute;display:flex;align-items:center;justify-content:center;gap:.42em;
  font-family:'Bungee',sans-serif;
  font-size:13.5px;letter-spacing:.6px;white-space:nowrap;
  cursor:ew-resize;touch-action:none;
}
#title .nm{
  color:var(--gold);
  text-shadow:0 0 7px rgba(255,212,71,.9),0 0 17px rgba(255,212,71,.62);
}
#title .sfx{
  color:var(--hot);
  text-shadow:0 0 8px rgba(255,20,147,.95),0 0 22px rgba(255,0,110,.65);
}

/* ---- display ---------------------------------------------------- */
#display{
  position:absolute;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  /* symmetric padding so the headline centres on the region itself;
     the pink subline is absolute and sits outside this flow */
  padding:4px 14px;box-sizing:border-box;overflow:hidden;
}
#display::before{ /* scanlines */
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
}
#dsp-main{
  font-family:'Bungee',sans-serif;text-align:center;line-height:1.04;
  color:var(--cyan);text-shadow:0 0 10px currentColor,0 0 28px currentColor;
  font-size:28px;transition:color .2s;
  transform:translateY(-12px);   /* headline rides above the centre line */
}
/* pink subline is pinned near the bottom of the screen, not stacked under the main */
#dsp-sub{position:absolute;left:0;right:0;bottom:13px;margin:0;
  font-size:10px;font-weight:700;letter-spacing:2px;
  text-align:center;color:var(--neon);text-shadow:0 0 8px currentColor}

/* logo slide — alpha from the supplied artwork, tinted like screen text */
#dsp-logo{
  width:82%;height:72%;background:var(--cyan);display:none;
  transform:translateY(-7px) scale(1.5);
  -webkit-mask:var(--logo) center/contain no-repeat;
          mask:var(--logo) center/contain no-repeat;
  filter:drop-shadow(0 0 4px var(--cyan))
         drop-shadow(0 0 11px var(--cyan))
         drop-shadow(0 0 24px rgba(34,230,230,.82));
}
#atm-root.logo-slide #dsp-logo{display:block}
#atm-root.logo-slide #dsp-main{display:none}
#dsp-meta{margin-top:4px;font-size:9px;font-weight:700;letter-spacing:1.6px;
  color:var(--cyan);text-shadow:0 0 6px currentColor;opacity:.9}
#bar{margin-top:7px;width:88%;height:6px;border-radius:3px;
  background:rgba(255,255,255,.12);overflow:hidden;display:none}
#bar-fill{height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--cyan),var(--gold));
  box-shadow:0 0 8px var(--cyan),0 0 12px rgba(255,212,71,.6);transition:width .5s cubic-bezier(.2,.9,.25,1)}
#atm-root.s-armed #bar{display:block}
#atm-root.s-entry #dsp-main,#atm-root.s-armed #dsp-main,
#atm-root.s-smashed #dsp-main,#atm-root.s-dispensing #dsp-main{
  color:var(--gold);
  text-shadow:0 0 9px rgba(255,212,71,.9),0 0 24px rgba(255,212,71,.62)
}
#atm-root.s-declined #dsp-main{color:var(--danger)}

/* Transaction confirmation becomes the LED readout itself. */
#transaction-confirm{
  position:absolute;left:0;right:0;bottom:18px;z-index:4;display:none;
  align-items:center;justify-content:center;background:transparent;
}
#transaction-confirm.show{display:flex}
.transaction-actions{display:flex;gap:22px}
.transaction-actions button{
  min-width:58px;padding:4px 10px;border:1px solid currentColor;
  border-radius:5px;background:rgba(8,18,25,.48);color:var(--cyan);
  font:700 10px/1 'Chakra Petch',sans-serif;letter-spacing:1.5px;
  cursor:pointer;text-shadow:0 0 7px currentColor;box-shadow:0 0 7px currentColor;
}
#atm-root.confirm-complete #dsp-main,.confirm-complete .transaction-actions button{
  color:var(--cyan);text-shadow:0 0 9px currentColor,0 0 25px currentColor;
}
#atm-root.confirm-cancel #dsp-main,.confirm-cancel .transaction-actions button{
  color:var(--danger);text-shadow:0 0 9px currentColor,0 0 25px currentColor;
}
.confirm-complete .transaction-actions button:hover{background:rgba(34,230,230,.18)}
.confirm-cancel .transaction-actions button:hover{background:rgba(255,43,61,.18)}
.transaction-actions button:active{transform:scale(.94)}
#atm-root.confirm-complete #dsp-sub,#atm-root.confirm-complete #dsp-meta,
#atm-root.confirm-complete #bar,#atm-root.confirm-cancel #dsp-sub,
#atm-root.confirm-cancel #dsp-meta,#atm-root.confirm-cancel #bar{display:none}

/* ---- timer editor, shown inside the screen ---------------------- */
/* The timer row REPLACES the headline while setting — same colour,
   same optical position, so the screen never shows both at once. */
#timerpad{
  display:none;align-items:center;justify-content:center;gap:16px;
  transform:translateY(-12px);          /* matches #dsp-main's offset */
}
#atm-root.timerset #timerpad{display:flex}
#atm-root.timerset #dsp-main,
#atm-root.timerset #dsp-meta{display:none}

.tbtn,.tval,.tset{
  color:var(--cyan);
  text-shadow:0 0 10px currentColor,0 0 26px currentColor;
}
/* bare arrows, no chrome */
.tbtn{
  cursor:pointer;background:none;border:none;
  font-size:19px;line-height:1;padding:0 2px;
  transition:transform .12s,filter .12s;
}
.tbtn:hover{transform:scale(1.22);filter:brightness(1.3)}
.tbtn:active{transform:scale(.9)}

.tval{
  font-family:'Bungee',sans-serif;font-size:26px;line-height:1;
  min-width:96px;text-align:center;
}
.tset{
  cursor:pointer;border:2px solid var(--cyan);border-radius:7px;
  background:rgba(34,230,230,.08);
  padding:5px 13px;font-weight:700;font-size:11px;letter-spacing:2px;
  transition:background .12s,transform .12s;
}
.tset:hover{background:rgba(34,230,230,.30)}
.tset:active{transform:scale(.92)}

/* ---- dispenser slot glow ---------------------------------------- */
#slotglow{
  position:absolute;z-index:6;border-radius:20px;
  background:linear-gradient(90deg,transparent,var(--neon) 12%,var(--neon) 88%,transparent);
  opacity:.7;
  box-shadow:0 0 16px var(--neon),0 0 34px rgba(255,45,149,.55);
  transition:opacity .25s,background .25s,box-shadow .25s,transform .25s;
}
#slotglow.munch{animation:mouthMunch .24s ease-in-out infinite;transform-origin:center}
@keyframes mouthMunch{
  0%,100%{transform:scaleY(.72)}
  48%{transform:scaleY(1.34)}
  72%{transform:scaleY(.92)}
}
#atm-root.s-dispensing #slotglow{
  opacity:1;
  background:linear-gradient(90deg,transparent,#ff63b7 12%,#ff63b7 88%,transparent);
  box-shadow:0 0 22px #ff63b7,0 0 48px rgba(255,45,149,.88);
  transform:scaleY(1.5);
}

/* ---- credit card insertion --------------------------------------- */
/* A fixed clipped window begins at the mouth. The card moves inside
   it, so everything crossing above the pink bar is genuinely masked. */
#cardwrap{
  position:absolute;z-index:5;pointer-events:none;
  overflow:hidden;opacity:1;
}
#cardwrap img{
  position:absolute;left:11%;top:0;width:78%;height:auto;
  object-fit:contain;border-radius:6%;opacity:0;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
}
#cardwrap.rise img{
  animation:cardEat 2.55s cubic-bezier(.2,.72,.24,1) forwards;
}
@keyframes cardEat{
  0%  {opacity:0;transform:translateY(38%) rotateZ(var(--card-start-rot)) scale(.96)}
  13% {opacity:1;transform:translateY(24%) rotateZ(var(--card-start-rot)) scale(1)}
  42% {opacity:1;transform:translateY(24%) rotateZ(var(--card-start-rot)) scale(1)}
  59% {opacity:1;transform:translateY(8%) rotateZ(calc(var(--card-start-rot) + 90deg)) scale(1)}
  73% {opacity:1;transform:translateY(-12%) rotateZ(calc(var(--card-start-rot) + 90deg)) scale(.99)}
  95% {opacity:1;transform:translateY(-88%) rotateZ(calc(var(--card-start-rot) + 90deg)) scale(.96)}
  100%{opacity:0;transform:translateY(-108%) rotateZ(calc(var(--card-start-rot) + 90deg)) scale(.94)}
}

/* ---- keypad (hit areas over the painted keys) -------------------- */
/* the pad spans the whole stage, so it must not swallow clicks
   aimed at anything under it (the timer pad lives inside the screen) */
#keypad{pointer-events:none}
.key{
  position:absolute;cursor:pointer;pointer-events:auto;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;
  color:#f4e6ff;text-shadow:0 1px 3px rgba(0,0,0,.85);
  transition:background .09s,transform .09s,box-shadow .09s;
}
.key:hover{
  background:rgba(255,20,147,.46);
  box-shadow:0 0 14px rgba(255,20,147,.65), inset 0 0 12px rgba(255,20,147,.35);
}
.key.down{
  background:var(--neon);color:#fff;transform:scale(.93);
  box-shadow:0 0 20px var(--neon),0 0 40px rgba(255,45,149,.7);
}
.key.ok{color:var(--gold);text-shadow:0 0 8px rgba(255,212,71,.82)}
.key .shuffle-icon{
  width:62%;height:62%;background:currentColor;
  transform:translateY(0);
  -webkit-mask:var(--shuffle) center/contain no-repeat;
          mask:var(--shuffle) center/contain no-repeat;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.85));
}
.key.ok.down{background:linear-gradient(145deg,#ff76bd,#ff3f9b);color:#fff;text-shadow:0 0 5px rgba(255,255,255,.9);box-shadow:0 0 20px #ff4aa8,0 0 38px rgba(255,63,155,.62)}

/* ---- bottom total window ---------------------------------------- */
#totalbar{
  position:absolute;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
#totalbar .lbl{font-size:9px;font-weight:700;letter-spacing:2.4px;
  color:var(--cyan);text-shadow:0 0 8px currentColor}
#totalbar .val{font-family:'Bungee',sans-serif;font-size:25px;color:var(--gold);
  text-shadow:0 0 8px rgba(255,212,71,.9),0 0 20px rgba(255,212,71,.62);line-height:1.15}

/* ---- six jewel controls, three on each side ----------------------
   Tall hexagon cut to the jewels' own silhouette. box-shadow would be
   clipped away, so the glow is a drop-shadow filter instead.          */
.gem{
  position:absolute;cursor:pointer;
  clip-path:polygon(50% 0%,100% 26%,100% 74%,50% 100%,0% 74%,0% 26%);
  transition:transform .18s,background .18s,filter .18s;
}
.gem:hover{transform:scale(1.12);animation:none}

/* low ambient bloom on every diamond overlay; each row follows the
   purple / pink / cyan color of the jewel artwork underneath it */
#gemL1,#gemR1{
  background:rgba(168,60,255,.10);
  filter:blur(1.1px) drop-shadow(0 0 7px rgba(168,60,255,.68));
}
#gemL2,#gemR2{
  background:rgba(255,45,149,.10);
  filter:blur(1.1px) drop-shadow(0 0 7px rgba(255,45,149,.68));
}
#gemL3,#gemR3{
  background:rgba(34,230,230,.10);
  filter:blur(1.1px) drop-shadow(0 0 7px rgba(34,230,230,.68));
}

#gemR3{animation:pulseCyan 3.2s ease-in-out infinite}
#gemR3:hover{background:rgba(34,230,230,.38);
  filter:blur(2px) drop-shadow(0 0 10px var(--cyan)) brightness(1.35)}
@keyframes pulseCyan{
  0%,100%{filter:blur(1.1px) drop-shadow(0 0 7px rgba(34,230,230,.68))}
  50%    {filter:blur(1.4px) drop-shadow(0 0 12px rgba(34,230,230,.95))}
}

/* the Clear jewel only advertises itself while a goal is live */
.gem.gem-on{background:rgba(255,255,255,.30);
  filter:blur(2px) drop-shadow(0 0 11px #fff) brightness(1.4)}
#atm-root.s-armed #gemR2{animation:pulsePink 1.6s ease-in-out infinite}
#gemR2:hover{background:rgba(255,45,149,.40);
  filter:blur(2px) drop-shadow(0 0 10px var(--neon)) brightness(1.35)}
#gemR1:hover{background:rgba(168,60,255,.42);
  filter:blur(2px) drop-shadow(0 0 10px #a83cff) brightness(1.35)}
#gemL1:hover,#gemL2:hover,#gemL3:hover{
  background:rgba(255,255,255,.16);filter:blur(2px)}
@keyframes pulsePink{
  0%,100%{filter:blur(1.1px) drop-shadow(0 0 7px rgba(255,45,149,.68))}
  50%    {filter:blur(1.4px) drop-shadow(0 0 12px rgba(255,45,149,.98))}
}

/* Invisible round hit areas over the two lower chrome rivets. */
.rivet-control{
  position:absolute;z-index:9;margin:0;padding:0;border:0;border-radius:50%;
  background:transparent;box-shadow:none;outline:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.rivet-control:hover,.rivet-control:focus,.rivet-control:active{
  background:transparent;box-shadow:none;filter:none;transform:none;outline:none;
}

/* ---- cash ------------------------------------------------------- */
.bill{
  position:absolute;width:105px;height:49.5px;border-radius:2px;
  background:var(--billz) center/100% 100% no-repeat;
  box-shadow:0 3px 10px rgba(0,0,0,.55),0 0 14px rgba(255,212,71,.48);
}

/* ---- tip toast (band across the face) --------------------------- */
.toast{
  position:relative;width:100%;box-sizing:border-box;
  transform:translateX(-118%);opacity:0;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(110deg,rgba(20,4,30,.94),rgba(60,10,60,.9));
  border:2px solid var(--gold);border-radius:12px;padding:9px 14px;
  box-shadow:0 0 22px rgba(255,212,71,.55),inset 0 0 20px rgba(169,101,0,.18);
  animation:toastIn .38s cubic-bezier(.2,1.3,.4,1) forwards,toastOut .38s ease-in forwards 3.6s;
}
@keyframes toastIn{to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(-118%);opacity:0}}
.toast .kind{flex:0 0 auto;font-size:8px;font-weight:700;letter-spacing:1.5px;
  color:#2b0f3d;background:var(--cyan);border-radius:4px;padding:3px 6px}
.toast .who{flex:1;min-width:0;font-size:13px;font-weight:700;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .amt{flex:0 0 auto;font-family:'Bungee',sans-serif;font-size:18px;
  color:var(--gold);text-shadow:0 0 10px rgba(255,212,71,.9)}
/* the tip alert used to cross the face, so the eyes dimmed behind it.
   It now sits over the total window, so they stay lit. */

/* ---- receipt ---------------------------------------------------- */
#receipt{
  position:absolute;right:6px;bottom:14px;width:180px;
  background:#fdf6ec;color:#1b1020;padding:12px 13px 14px;border-radius:3px;
  font-size:9.5px;letter-spacing:.3px;
  box-shadow:0 10px 26px rgba(0,0,0,.65);
  transform:translateY(118%);opacity:0;
  transition:transform .75s cubic-bezier(.25,1,.4,1),opacity .3s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),94% 100%,88% calc(100% - 6px),82% 100%,76% calc(100% - 6px),70% 100%,64% calc(100% - 6px),58% 100%,52% calc(100% - 6px),46% 100%,40% calc(100% - 6px),34% 100%,28% calc(100% - 6px),22% 100%,16% calc(100% - 6px),10% 100%,4% calc(100% - 6px),0 100%);
}
#receipt.show{transform:translateY(0);opacity:1}
#receipt h4{margin:0 0 3px;font-family:'Bungee',sans-serif;font-size:9.5px;
  color:#6a2fb5;text-align:center;line-height:1.3}
#receipt .rsub{text-align:center;font-size:7px;letter-spacing:1.5px;color:#8a6f9b;margin-bottom:8px}
#receipt .row{display:flex;justify-content:space-between;gap:8px;margin:2px 0;font-weight:600}
#receipt .row .k{color:#6b5578;letter-spacing:.9px;font-size:8px;flex:0 0 auto}
#receipt hr{border:none;border-top:1px dashed #c9b8d4;margin:7px 0}
#receipt .due{text-align:center;margin:5px 0}
#receipt .due .k{font-size:7.5px;letter-spacing:1.8px;color:#8a6f9b}
#receipt .due .v{font-family:'Bungee',sans-serif;font-size:20px;color:#6a2fb5;line-height:1.2}
#receipt .foot{text-align:center;font-size:7px;letter-spacing:1.2px;color:#8a6f9b;margin-top:8px}
#receipt .receipt-close{
  position:absolute;top:3px;right:4px;width:15px;height:15px;padding:0;
  border:0;background:transparent;color:rgba(107,85,120,.58);cursor:pointer;
  font:600 11px/15px Arial,sans-serif;text-align:center;
  transition:color .15s,transform .15s;
}
#receipt .receipt-close:hover{color:#6a2fb5;transform:scale(1.12)}

/* ---- leaderboard ------------------------------------------------ */
#board{
  /* inset from the full stage (rather than flush edge-to-edge) so the
     chassis's own edge-glow — swapped to purple while this is open —
     shows as a visible rim around the panel instead of being fully
     hidden underneath it */
  position:absolute;inset:16px;display:none;flex-direction:column;
  padding:20px 22px;box-sizing:border-box;border-radius:22px;
  background:linear-gradient(170deg,#2a0f3d,#140820);
  border:3px solid var(--silver);
  box-shadow:0 0 8px rgba(255,255,255,.95),0 0 19px rgba(195,212,235,.85),0 0 50px rgba(135,155,205,.45);
}
#board.show{display:flex;animation:boardIn .25s ease-out}
@keyframes boardIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#board h3{margin:0;text-align:center;font-family:'Bungee',sans-serif;
  font-size:21px;color:var(--silver);text-shadow:0 0 4px #fff,0 0 12px rgba(205,220,240,.9)}
#board .bsub{text-align:center;font-size:9.5px;letter-spacing:2.6px;color:var(--neon);margin-top:5px}
#board-close{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--neon);color:var(--neon);background:rgba(255,45,149,.1);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
#board-close:hover{background:var(--neon);color:#fff}
#board-tabs{display:flex;gap:8px;margin:14px 0 10px;align-items:center}
.tab{padding:5px 14px;border-radius:8px;cursor:pointer;font-size:10px;font-weight:700;
  letter-spacing:2px;border:2px solid var(--neon);color:var(--neon);background:transparent}
.tab.on{background:var(--neon);color:#fff;box-shadow:0 0 12px var(--neon)}
#reset-all{align-self:center;margin-top:11px;padding:5px 15px;border-radius:8px;cursor:pointer;font-size:9px;
  font-weight:700;letter-spacing:1.6px;border:2px solid var(--silver);color:var(--silver);background:transparent}
#reset-all:hover{background:var(--silver);color:#2b0f3d;box-shadow:0 0 12px rgba(220,232,248,.85)}
#rows{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:5px}
#rows::-webkit-scrollbar{width:5px}
#rows::-webkit-scrollbar-thumb{background:var(--neon);border-radius:3px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;
  border:1px solid rgba(255,45,149,.35);background:rgba(255,45,149,.05)}
.lrow .rank{font-family:'Bungee',sans-serif;font-size:14px;color:var(--silver);width:20px;text-align:center}
.lrow .who{flex:1;min-width:0}
.lrow .who .n{font-size:12.5px;font-weight:700;color:#fff;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lrow .who .m{font-size:8.5px;letter-spacing:1.5px;color:var(--ink-dim);margin-top:1px}
.lrow .amt{font-family:'Bungee',sans-serif;font-size:15px;color:var(--silver)}
.lrow .clr{padding:3px 8px;border-radius:6px;font-size:8px;font-weight:700;letter-spacing:1.2px;
  border:1px solid var(--neon);color:var(--neon);background:transparent;cursor:pointer}
.lrow .clr:hover{background:var(--neon);color:#fff}
.lrow.top1{border-color:var(--silver-dim);background:rgba(220,230,245,.07);box-shadow:0 0 12px rgba(190,210,235,.22)}
#board-foot{display:flex;justify-content:space-between;margin-top:11px;
  font-size:9px;font-weight:700;letter-spacing:1.8px;color:var(--neon)}
#board-empty{text-align:center;color:var(--ink-dim);font-size:11px;letter-spacing:2px;padding:40px 0}


/* ---- Mistress Mayhem visual treatment --------------------------- */
#glow{left:2.5%;right:auto;width:95%}
#title .nm{
  color:var(--maroon);
  text-shadow:0 1px 0 rgba(255,255,255,.22),0 0 7px rgba(143,36,82,.42)
}
#atm-root.s-entry #dsp-main,#atm-root.s-armed #dsp-main,
#atm-root.s-smashed #dsp-main,#atm-root.s-dispensing #dsp-main{
  color:var(--bright-silver);
  text-shadow:0 0 5px #fff,0 0 15px rgba(220,232,245,.9),0 0 26px rgba(202,216,232,.66)
}
#dsp-sub,#dsp-meta{
  font-variant-caps:small-caps;text-transform:none;
  font-weight:800
}
#dsp-sub{font-size:11px}
#dsp-meta{font-size:10px}
#dsp-meta,#bar{position:relative;top:-12px}
#totalbar .val{
  color:var(--bright-silver);
  text-shadow:0 0 5px #fff,0 0 14px rgba(220,232,245,.9),0 0 24px rgba(202,216,232,.65)
}
#receipt h4,#receipt .due .v{color:var(--maroon)}
#receipt h4{white-space:pre-line}
#receipt .rsub,#receipt .due .k,#receipt .foot,#receipt .row .k{color:var(--maroon)}
#receipt hr{border-top-color:var(--maroon)}
#receipt .receipt-close{color:rgba(143,36,82,.62)}
#receipt .receipt-close:hover{color:var(--maroon)}
.gem{clip-path:circle(50% at 50% 50%);border-radius:50%}
.toast{
  border-color:var(--bright-silver);
  box-shadow:0 0 22px rgba(226,234,244,.62),inset 0 0 20px rgba(190,205,222,.18)
}
.toast .amt{
  color:var(--bright-silver);
  text-shadow:0 0 5px #fff,0 0 12px rgba(220,232,245,.9)
}
#bar-fill{
  background:linear-gradient(90deg,#FF4AA8,#A83CFF);
  box-shadow:0 0 8px #FF4AA8,0 0 13px rgba(168,60,255,.78)
}
.key-label{display:block;transform:translateY(-3px)}
#keypad .key:nth-child(-n+3) .key-label{
  transform:translateY(-2px) scaleY(.9)
}
#keypad .key:nth-child(11) .key-label{
  transform:translateY(-2px)
}
.key .shuffle-icon{
  position:relative;background:var(--shuffle) center/contain no-repeat;filter:none;
  -webkit-mask:none;mask:none;transform:translateY(-1px)
}
.key .shuffle-icon::before,.key .shuffle-icon::after{
  content:none
}
.key.ok{
  color:var(--maroon);
  text-shadow:0 1px 2px rgba(25,8,30,.82),0 0 7px rgba(143,36,82,.48)
}
.eye::before{
  background:
    radial-gradient(circle at 62% 72%,rgba(255,18,92,.28),rgba(145,0,54,.13) 57%,transparent 77%),
    radial-gradient(ellipse at 23% 78%,rgba(195,0,62,.11),transparent 48%)
}
#atm-root.very-redeyes .eye::before{
  background:
    radial-gradient(circle at 62% 72%,rgba(255,12,82,.54),rgba(155,0,50,.30) 58%,transparent 80%),
    radial-gradient(ellipse at 23% 78%,rgba(215,0,68,.27),transparent 52%);
  box-shadow:inset 0 0 17px rgba(185,0,58,.25)
}
#pupil-hue-slider,#pupil-hue-reset{position:absolute;background:transparent;touch-action:none}
#pupil-hue-slider{cursor:ew-resize}
#pupil-hue-reset{border:0;padding:0;border-radius:50%;cursor:pointer}
</style>
</head>

function place(el, r){

/* =============================================================
   RESET PERIOD BUCKETS
   ============================================================= */
function periodKey(d = new Date()){
  const p = CFG.resetPeriod;
  if (p==='never')  return 'all';
  if (p==='stream') return 'session';
  const y = d.getFullYear();
  if (p==='yearly')  return 'y'+y;
  if (p==='monthly') return 'y'+y+'m'+(d.getMonth()+1);
  if (p==='weekly'){
    const t=new Date(d); t.setHours(0,0,0,0);
    t.setDate(t.getDate()+4-(t.getDay()||7));
    const start=new Date(t.getFullYear(),0,1);
    return 'y'+t.getFullYear()+'w'+Math.ceil(((t-start)/86400000+1)/7);
  }
  return 'd'+d.toISOString().slice(0,10);
}
let CURRENT_PERIOD = periodKey();
function checkPeriodRollover(){
  const k = periodKey();
  if (k !== CURRENT_PERIOD){
    CURRENT_PERIOD = k;
    S.board={}; S.periodTotal=0; S.drains=0;
    renderBoard(); renderTotals(); savePersistentState();
  }
}

function press(def){
  const act = def.act || 'digit';
  if (R.classList.contains('timerset')){ pressTimerKey(def); return; }
  // Clear is handled by the right red jewel, so the pad is inert while armed.
  if (S.state === 'armed') return;
  if (S.state !== 'idle' && S.state !== 'entry') return;
  if (act === 'random'){ rollRandom(); return; }
  if (act === 'confirm'){ const v = parseInt(S.entry,10); if (v>0) armGoal(v); return; }
  if (S.entry.length >= 6) return;
  S.entry = (S.entry + def.l).replace(/^0+/,'');
  stopIdle(); setState('entry');
  const E = TEXT.screen.entry, ev = { amount: money(+S.entry || 0) };
  show(t(E.big,ev), t(E.small,ev));
}

/* clear if idle, abandon the goal if one is live */
function cancelPressed(){
  if (R.classList.contains('timerset')){ closeTimerPad(); return; }
  if (S.state === 'armed'){ endGoal(false, true); return; }
  S.entry = '';
  clearTimeout(rollRandom._t);
  startIdle();
}

/* RANDOM — shuffles through values, decelerating into the result */
function rollRandom(){
  stopIdle(); hideReceipt(); setState('entry');
  const lo = CFG.randomMin, hi = CFG.randomMax;
  const pick = () => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const target = pick();
  const rollingSmall = oneOf(TEXT.screen.randomRolling.small);
  const t0 = Date.now(), DUR = 1250;
  clearTimeout(rollRandom._t);
  (function step(){
    const p = Math.min(1, (Date.now() - t0) / DUR);
    if (p >= 1){
      S.entry = String(target);
      armGoal(target);
      return;
    }
    const Rl = TEXT.screen.randomRolling, rv = { amount: money(pick()) };
    show(t(Rl.big,rv), t(rollingSmall,rv));
    rollRandom._t = setTimeout(step, 38 + p * p * 165);   // eases out
  })();
}

/* hover preview: borrow the screen, then hand it back */
let peekSaved = null;
function peek(text){
  if (S.state !== 'idle' && S.state !== 'entry') return;
  if (peekSaved === null){
    peekSaved = {
      main: $('dsp-main').textContent, sub: $('dsp-sub').textContent,
      meta: $('dsp-meta').textContent, logo: R.classList.contains('logo-slide')
    };
    stopIdle();
  }
  R.classList.remove('logo-slide');
  $('dsp-main').textContent = text;
  $('dsp-sub').textContent = '';
  $('dsp-meta').textContent = '';
  fitDisplay();
}
function unpeek(){
  if (peekSaved === null) return;
  const s = peekSaved; peekSaved = null;
  if (S.state === 'idle'){ startIdle(); return; }
  $('dsp-main').textContent = s.main;
  $('dsp-sub').textContent  = s.sub;
  $('dsp-meta').textContent = s.meta;
  R.classList.toggle('logo-slide', s.logo);
  fitDisplay();
}

/* =============================================================
   GOAL LIFECYCLE
   ============================================================= */
function armGoal(amount){
  stopIdle(); hideReceipt();
  S.goal=amount; S.raised=0; S.entry=''; S.contributors=[]; S.ending=false;
  closeTransactionConfirm();
  S.deadline = Date.now() + CFG.goalSeconds*1000;
  // Preserve the manually selected eye state as this round's baseline.
  // Countdown pressure adds 0 / +1 / +2 and caps at very red.
  S.redEyeBase = redEyeLevel;
  setState('armed'); renderArmed();
  EYE.restScale = 0.9;                 // pupils tighten while a goal is live
  dilate(0.9, 0.10);
  clearInterval(S.tick);
  S.tick = setInterval(()=>{
    if (Date.now() >= S.deadline) endGoal(false); else renderArmed();
  }, 250);
}
const clockStr = ms => {
  const t = Math.max(0, Math.ceil(ms/1000));
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
};
function renderArmed(){
  if (S.confirmAction){
    renderTransactionConfirm();
    return;
  }
  const A = TEXT.screen.armed;
  const remaining = S.deadline - Date.now();
  const escalation = remaining <= 20000 ? 2 : remaining <= 60000 ? 1 : 0;
  setRedEyeLevel(Math.min(2, S.redEyeBase + escalation));
  const vars = { goal:money(S.goal), raised:money(S.raised),
                 owed:money(S.goal-S.raised), clock:clockStr(remaining) };
  $('dsp-main').textContent = t(A.big,  vars);
  $('dsp-sub').textContent  = t(A.small, vars);
  $('dsp-meta').textContent = t(A.meta,  vars);
  $('bar-fill').style.width = Math.min(100, S.raised/S.goal*100) + '%';
  fitDisplay();
}
function endGoal(success, cancelled){
  // Completion is asynchronous (card check, celebration, receipt). Lock the
  // round immediately so a contribution arriving during that sequence cannot
  // start a second card/receipt flow or mutate the completed round.
  if (S.ending) return;
  S.ending = true;
  closeTransactionConfirm();
  clearInterval(S.tick); S.tick=null;
  EYE.restScale = 1;
  if (cancelled){ setRedEyeLevel(0); dilate(1, 0.06); S.goal=0; startIdle(); return; }
  if (success){
    setRedEyeLevel(0);
    S.drains++;
    // a card fades up below the slot, rotates 90 degrees and slides into the
    // mouth while the screen reads VERIFYING... then APPROVED, before
    // the existing goal-hit / spiral-eyes / dispense sequence runs.
    const hv = { goal:money(S.goal) };
    show(TEXT.screen.cardCheck.big, TEXT.screen.cardCheck.small);
    playCardInsert(
      ()=>{
        show(TEXT.screen.cardApproved.big, t(TEXT.screen.cardApproved.small,hv));
        R.classList.remove('verified-shake');
        void R.offsetWidth;
        R.classList.add('verified-shake');
        setTimeout(()=>R.classList.remove('verified-shake'), 840);
        queueEyeAim(0, 0, 360);             // verified: snap back to centre
      },
      ()=>{
        aimEyes(0, 0);
        setState('smashed');
        const H = TEXT.screen.goalHit;
        show(t(oneOf(H.big),hv), t(H.small,hv));
        burstParticles();
        dilate(1, 0.03);                  // slow drift home while the spiral spins
        setTimeout(dispense, 900);
      }
    );
  } else {
    setRedEyeLevel(1);
    lockEyes(0, 0);
    setState('declined');
    const D = TEXT.screen.declined;
    const dv = { raised:money(S.raised), goal:money(S.goal) };
    show(t(D.big,dv), t(D.small,dv));
    R.classList.remove('declined-shake');
    void R.offsetWidth;
    R.classList.add('declined-shake');
    setTimeout(()=>R.classList.remove('declined-shake'), 360);
    // a second red message rides out the decline before idle resumes
    setTimeout(()=>{
      if (S.state !== 'declined') return;
      const F = TEXT.screen.declinedFollowUp;
      show(t(oneOf(F.big),dv), t(oneOf(F.small),dv));
      R.classList.add('fup');
      aimEyes(0, 0);
    }, CFG.declineHold);
    setTimeout(()=>{
      if (S.state !== 'declined') return;
      setRedEyeLevel(0);
      S.goal = 0; startIdle();
    }, CFG.declineHold + CFG.declineFollowUpHold);
  }
}

/* =============================================================
   HIDDEN BOTTOM-RIVET ROUND CONTROLS
   These are intentionally invisible and inert outside a live round.
   The countdown continues while a confirmation question is open.
   ============================================================= */
function renderTransactionConfirm(){
  const box = $('transaction-confirm');
  if (!S.confirmAction){ box.classList.remove('show'); return; }
  const complete = S.confirmAction === 'complete';
  const remainder = Math.max(0, S.goal - S.raised);
  $('dsp-main').textContent = complete ? `ADD FUNDS? ${money(remainder)}` : 'CANCEL?';
  $('dsp-sub').textContent = '';
  $('dsp-meta').textContent = '';
  R.classList.toggle('confirm-complete', complete);
  R.classList.toggle('confirm-cancel', !complete);
  box.classList.add('show');
  R.classList.remove('logo-slide');
  fitDisplay();
}
function openTransactionConfirm(action){
  if (S.state !== 'armed' || S.ending) return;
  S.confirmAction = action;
  renderTransactionConfirm();
}
function closeTransactionConfirm(){
  S.confirmAction = null;
  const box = $('transaction-confirm');
  if (box) box.classList.remove('show');
  R.classList.remove('confirm-complete','confirm-cancel');
}
function confirmTransaction(accepted){
  if (S.state !== 'armed' || S.ending || !S.confirmAction) return;
  const action = S.confirmAction;
  closeTransactionConfirm();
  if (!accepted){ renderArmed(); return; }
  if (action === 'complete'){
    const remainder = Math.max(0, S.goal - S.raised);
    if (remainder > 0){
      S.raised += remainder;
      S.periodTotal += remainder;
      renderTotals();
      savePersistentState();
    }
    endGoal(true);
  } else {
    endGoal(false);
  }
}

$('complete-rivet').addEventListener('click',()=>openTransactionConfirm('complete'));
$('cancel-rivet').addEventListener('click',()=>openTransactionConfirm('cancel'));
$('transaction-confirm').addEventListener('click',e=>{

  if (answer) confirmTransaction(answer === 'yes');

  void R.offsetWidth;
  R.classList.add('dispense-jump');
  dispense._jumpT = setTimeout(()=>R.classList.remove('dispense-jump'), 740);

  sprayCash(17);
  const c = setInterval(()=>{
    const p = Math.min(1,(Date.now()-t0)/DUR);
    const Dp = TEXT.screen.dispensing;
    const pv = { goal:money(target), paid:money(Math.round(target*p)) };
    show(t(Dp.big,pv), t(Dp.small,pv));

      R.classList.add('dispense-final-jump');
      clearTimeout(dispense._finalJumpT);
      dispense._finalJumpT = setTimeout(()=>R.classList.remove('dispense-final-jump'), 700);
      printReceipt();
      S.goal=0;
      startIdle();
    }
  }, 80);
}

/* =============================================================
   INCOMING MONEY
   ============================================================= */
function contribute(name, amount, kind){
  checkPeriodRollover();
  if (amount < CFG.minToCount) return;
  S.periodTotal += amount;
  const e = S.board[name] || (S.board[name] = {total:0,count:0,last:null,months:{}});
  e.total += amount; e.count++; e.last = new Date();
  e.months ||= {};
  const mk = monthKey(e.last);
  const m = e.months[mk] || (e.months[mk] = {total:0,count:0,last:null});
  m.total += amount; m.count++; m.last = e.last;
  toast(name, amount, kind);
  if (S.state === 'armed' && !S.ending){
    S.raised += amount;
    const ex = S.contributors.find(c=>c.name===name);
    ex ? ex.amount += amount : S.contributors.push({name, amount});
    if (CFG.tipAddsSeconds > 0) S.deadline += CFG.tipAddsSeconds*1000;
    renderArmed();
    eyeSequence([[1.25, 0.34, 420], [EYE.restScale, 0.045, 0]]);   // swell, then drift back
    if (S.raised >= S.goal) endGoal(true);
  }
  renderTotals();
  savePersistentState();
  if ($('board').classList.contains('show')) renderBoard();
}

  t.className = 'toast';

/* =============================================================
   CASH — sprays from the dispenser mouth
   ============================================================= */
function sprayCash(n){
  const layer = $('cash');
  const ox = (LAYOUT.slot.x + LAYOUT.slot.w/2) / ART.w * layer.offsetWidth;
  const oy = (LAYOUT.slot.y + LAYOUT.slot.h/2) / ART.h * layer.offsetHeight;
  for (let i=0;i<n;i++){
    setTimeout(()=>{
      const b = document.createElement('div');
      b.className='bill';
      b.style.left=(ox-52.5)+'px'; b.style.top=(oy-24.75)+'px';
      layer.appendChild(b);
      // larger, calmer paper drift: narrower spread, gentler rotation and
      // a longer fall so the bills read individually instead of exploding
      const dx=(Math.random()-.5)*300, peak=-70-Math.random()*60;
      const dy=255+Math.random()*180, rot=(Math.random()-.5)*300;
      const wob = (Math.random()-.5)*40;
      b.animate([
        {transform:'translate(0,0) rotate(0deg) scale(.5)',opacity:1,offset:0},
        {transform:`translate(${dx*.3}px,${peak}px) rotate(${rot*.18}deg) scale(1.01)`,opacity:1,offset:.24},
        {transform:`translate(${dx*.62+wob}px,${dy*.48}px) rotate(${rot*.52}deg) scale(1)`,opacity:1,offset:.58},
        {transform:`translate(${dx-wob*.45}px,${dy*.82}px) rotate(${rot*.78}deg) scale(1)`,opacity:1,offset:.82},
        {transform:`translate(${dx}px,${dy+35}px) rotate(${rot}deg) scale(1)`,opacity:0,offset:1}
      ],{duration:3450+Math.random()*1150,easing:'cubic-bezier(.22,.54,.32,1)'})
       .onfinish = () => b.remove();
    }, i*125);
  }
}

/* =============================================================
   TIMER EDITOR  (top-right jewel)
   ============================================================= */
let timerDraft = 0;
let timerDigits = '';
const MAX_TIMER_SECONDS = 60 * 60;

function applyTimerDraft(){
  if (timerDraft <= 0) return;
  CFG.goalSeconds = Math.min(MAX_TIMER_SECONDS, timerDraft);
  closeTimerPad();
}
function toggleTimerPad(){
  if (R.classList.contains('timerset')) { closeTimerPad(); return; }
  if (!['idle','entry'].includes(S.state)) return;
  stopIdle();
  timerDraft = Math.min(MAX_TIMER_SECONDS, CFG.goalSeconds);
  timerDigits = '';
  setState('entry');
  R.classList.add('timerset');          // after setState, so nothing clears it
  renderTimerPad();
}
function closeTimerPad(){
  R.classList.remove('timerset');       // release the screen before repainting
  S.entry = '';
  startIdle();
}
function renderTimerPad(){
  const T = TEXT.screen.timer, v = { clock: clockStr(timerDraft*1000) };
  $('dsp-sub').textContent  = t(T.small, v);   // pink line still reads SET TIMER
  $('dsp-meta').textContent = '';
  $('timerpad').querySelector('.tval').textContent = t(T.big, v);
}
function pressTimerKey(def){
  const act = def.act || 'digit';
  if (act === 'confirm'){
    applyTimerDraft();
    return;
  }
  if (act !== 'digit' || timerDigits.length >= 4) return;
  timerDigits += def.l;
  const raw = parseInt(timerDigits, 10) || 0;
  const minutes = Math.floor(raw / 100);
  const seconds = raw % 100;
  timerDraft = Math.min(MAX_TIMER_SECONDS, minutes * 60 + seconds);
  renderTimerPad();
}
$('timerpad').addEventListener('click', e=>{
  const a = e.target.getAttribute('data-t'); if (!a) return;
  const step = V.timerStepSeconds || 30;
  if (a === 'up')   { timerDigits=''; timerDraft = Math.min(MAX_TIMER_SECONDS, timerDraft + step); }
  if (a === 'down') { timerDigits=''; timerDraft = Math.max(step, timerDraft - step); }
  if (a === 'set'){ applyTimerDraft(); return; }
  renderTimerPad();
});

/* =============================================================
   EYE ENGINE
   Pupil position and size are driven per-frame from here, so the
   pupil controls, cursor following and scripted dilation beats can all
   act on the same two numbers without fighting CSS transitions.
   ============================================================= */
const EYE = {
  x:0, y:0,            // pupil offset, px
  scale:1, target:1,   // dilation, 1 = resting
  ease:0.12,           // how hard it chases target each frame
  follow:false,        // left teal jewel
  followActive:false,  // sleeps after 10s without cursor movement
  locked:false,        // finale choreography overrides cursor/ambient motion
  huge:false,          // true while the current dilation is above default
  restScale:1          // what it settles back to (armed shrinks this)
};

const PUPIL_PRESETS = [1, 2, 1, 0.5];
let pupilPresetStep = 0;
let configuredPupilDilation = 0.95;
let redEyeLevel = 0;
function setRedEyeLevel(level){
  const next = Math.max(0, Math.min(2, Number(level) || 0));
  if (next === redEyeLevel &&
      R.classList.contains('redeyes') === (next === 1) &&
      R.classList.contains('very-redeyes') === (next === 2)) return;
  redEyeLevel = next;
  R.classList.toggle('redeyes', next === 1);
  R.classList.toggle('very-redeyes', next === 2);
  $('gemL2').classList.toggle('gem-on', next > 0);
}
function setPupilDilation(value){
  const next = Math.max(0.3, Math.min(2.5, Number(value) || 1));
  V.pupilDilation = next;
  EYE.huge = next > 1.001;
  $('gemL1').classList.toggle('gem-on', Math.abs(next - 1) > 0.001);
}
function setConcernLevel(value){
  V.concern = value;
}

function applyEyes(){
  const s = EYE.scale * (V.pupilDilation || 1);
  document.querySelectorAll('.pupil').forEach(p=>{
    p.style.transform = `translate(${EYE.x.toFixed(2)}px,${EYE.y.toFixed(2)}px) scale(${s.toFixed(3)})`;
  });
  document.querySelectorAll('.glyph.dead').forEach(g=>{
    g.style.transform = `translate(${EYE.x.toFixed(2)}px,${EYE.y.toFixed(2)}px)`;
  });
}
(function eyeLoop(){
  EYE.scale += (EYE.target - EYE.scale) * EYE.ease;
  applyEyes();
  requestAnimationFrame(eyeLoop);
})();

/* aim the dilation at a value; ease is per-frame chase strength */
function dilate(to, ease){ EYE.target = to; if (ease != null) EYE.ease = ease; }

let gazeTimers = [];
function clearGazeTimers(){ gazeTimers.forEach(clearTimeout); gazeTimers = []; }
function aimEyes(x, y){ EYE.x = x; EYE.y = y; }
function queueEyeAim(x, y, delay){
  gazeTimers.push(setTimeout(()=>aimEyes(x,y), Math.max(0,delay)));
}
function lockEyes(x=0, y=0){
  clearGazeTimers();
  clearTimeout(cursorIdleTimer);
  EYE.locked = true;
  EYE.followActive = false;
  aimEyes(x,y);
}
function unlockEyes(){
  clearGazeTimers();
  EYE.locked = false;
  EYE.followActive = false;
  aimEyes(0,0);
}

/* scripted sequence: [[value, ease, holdMs], ...] */
let seqTimers = [];
function eyeSequence(steps){
  seqTimers.forEach(clearTimeout); seqTimers = [];
  let at = 0;
  steps.forEach(([val, ease, hold])=>{
    seqTimers.push(setTimeout(()=>dilate(val, ease), at));
    at += hold;
  });
}

/* ---- blinking ---- */

function scheduleBlink(){

  blinkTimer = setTimeout(()=>{
    R.classList.add('blink');
    setTimeout(()=>R.classList.remove('blink'), 210);
    scheduleBlink();
  }, wait);
}
scheduleBlink();

/* ---- darting (anxiety = how often, concern = how far) ---- */

  clearTimeout(dartTimer);
  const rate = Math.max(0.05, V.anxiety || 1);
  const wait = (1400 + Math.random()*2200) / rate;
  dartTimer = setTimeout(()=>{
    if (!EYE.locked && !EYE.followActive && !['dispensing','declined','smashed'].includes(S.state)){
      const reach = 9 * (V.concern || 1);
      EYE.x = (Math.random()-.5) * 2 * reach;
      EYE.y = (Math.random()-.5) * 1.4 * reach;
    }
    scheduleDart();
  }, wait);
}
scheduleDart();

/* ---- rare idle dilation twitch: a quick open, then snap back ---- */
setInterval(()=>{

  eyeSequence([[EYE.restScale * 1.18, 0.30, 260],
               [EYE.restScale,        0.22, 0]]);
}, 5200);

/* ---- eyes follow the cursor (left teal jewel) ---- */
let cursorIdleTimer = null;
const LAST_CURSOR = { x:window.innerWidth/2, y:window.innerHeight/2 };
function pointEyesAtCursor(clientX, clientY){
  if (EYE.locked) return;
  const box = $('eyes').getBoundingClientRect();
  const cx = box.left + box.width/2, cy = box.top + box.height/2;
  const reach = 11 * (V.concern || 1);
  const dx = (clientX - cx) / (box.width/2);
  const dy = (clientY - cy) / (box.height/2);
  const clamp = n => Math.max(-1, Math.min(1, n));
  EYE.x = clamp(dx) * reach;
  EYE.y = clamp(dy) * reach * 0.75;
}
function wakeCursorFollow(){
  if (!EYE.follow || EYE.locked) return;
  EYE.followActive = true;
  setConcernLevel(1.3);
  clearTimeout(cursorIdleTimer);
  cursorIdleTimer = setTimeout(()=>{
    EYE.followActive = false;
    setConcernLevel(1);
    EYE.x = 0; EYE.y = 0;
  }, 10000);
}
document.addEventListener('mousemove', e=>{
  LAST_CURSOR.x = e.clientX; LAST_CURSOR.y = e.clientY;
  if (!EYE.follow || EYE.locked) return;
  wakeCursorFollow();
  pointEyesAtCursor(e.clientX, e.clientY);
});

/* =============================================================
   STREAMELEMENTS FIELDS + EVENTS
   ============================================================= */
let widgetBooted = false;
let widgetScale = 1;
const STORAGE_KEY = 'mistress-mayhem-maytm-atm-v2';
const BUILT_IN_PUPIL_COLOR = '#7D294F';
let configuredPupilColor = BUILT_IN_PUPIL_COLOR;

const fieldText = (f, key, fallback) =>
  f[key] == null ? fallback : String(f[key]);
const fieldNumber = (f, key, fallback) => {
  const value = Number(f[key]);
  return Number.isFinite(value) ? value : fallback;
};
const fieldBool = (f, key, fallback) => {
  if (f[key] == null) return fallback;
  return f[key] === true || f[key] === 1 || f[key] === 'true' || f[key] === '1';
};
const pipeList = (value, fallback) => {
  const list = String(value == null ? '' : value).split('|').map(s=>s.trim()).filter(Boolean);
  return list.length ? list : fallback;
};

function hydrateFromFields(f){
  TEXT.brand.titleGold = fieldText(f,'titleGold',TEXT.brand.titleGold);
  TEXT.brand.streamerName = fieldText(f,'streamerName',TEXT.brand.streamerName);
  TEXT.brand.currency = fieldText(f,'currency',TEXT.brand.currency);
  TEXT.machine.totalLabel = fieldText(f,'totalLabel',TEXT.machine.totalLabel);
  const useBuiltInPupil = fieldBool(f,'useDefaultPupilColor',true);
  configuredPupilColor = useBuiltInPupil
    ? BUILT_IN_PUPIL_COLOR
    : fieldText(f,'defaultPupilColor',BUILT_IN_PUPIL_COLOR);
  R.style.setProperty('--pupil',configuredPupilColor);

  const idle = [];
  for (let i=1;i<=7;i++){
    if (!fieldBool(f,'idle'+i+'Include',i<=6)) continue;
    const big = fieldText(f,'idle'+i+'Big',i<=6 ? TEXT.screen.idleRotation[i-1].big : '').trim();
    const small = fieldText(f,'idle'+i+'Small',i<=6 ? TEXT.screen.idleRotation[i-1].small : '').trim();
    if (big || small) idle.push({big,small});
  }
  if (idle.length) TEXT.screen.idleRotation = idle;

  const pairs = [
    ['entry','entry'],['randomRolling','random'],['armed','armed'],
    ['dispensing','dispensing'],['declined','declined'],['timer','timer'],
    ['cardCheck','cardCheck'],['cardApproved','cardApproved']
  ];
  pairs.forEach(([screen,prefix])=>{
    TEXT.screen[screen].big = fieldText(f,prefix+'Big',TEXT.screen[screen].big);
    const smallFallback = TEXT.screen[screen].small;
    TEXT.screen[screen].small = screen === 'randomRolling'
      ? pipeList(f[prefix+'Small'],Array.isArray(smallFallback) ? smallFallback : [smallFallback])
      : fieldText(f,prefix+'Small',smallFallback);
  });
  TEXT.screen.armed.meta = fieldText(f,'armedMeta',TEXT.screen.armed.meta);
  TEXT.screen.goalHit.big = pipeList(f.goalHitMessages,TEXT.screen.goalHit.big);
  TEXT.screen.goalHit.small = fieldText(f,'goalHitSmall',TEXT.screen.goalHit.small);
  TEXT.screen.declinedFollowUp.big = pipeList(f.declinedFollowUpMessages,TEXT.screen.declinedFollowUp.big);
  TEXT.screen.declinedFollowUp.small = fieldText(f,'declinedFollowUpSmall',TEXT.screen.declinedFollowUp.small);
  TEXT.screen.hover.randomKey = fieldText(f,'hoverRandom',TEXT.screen.hover.randomKey);
  TEXT.screen.hover.timerJewel = fieldText(f,'hoverTimer',TEXT.screen.hover.timerJewel);
  TEXT.screen.hover.clearJewel = fieldText(f,'hoverClear',TEXT.screen.hover.clearJewel);
  TEXT.screen.hover.leaderboardJewel = fieldText(f,'hoverLeaderboard',TEXT.screen.hover.leaderboardJewel);

  TEXT.alerts.tip = fieldText(f,'alertTip',TEXT.alerts.tip);
  TEXT.alerts.bits = fieldText(f,'alertBits',TEXT.alerts.bits);
  TEXT.alerts.sub = fieldText(f,'alertSub',TEXT.alerts.sub);
  TEXT.receipt.org = fieldText(f,'receiptHeader',TEXT.receipt.org);
  TEXT.receipt.dueLabel = fieldText(f,'receiptAmountLabel',TEXT.receipt.dueLabel);
  TEXT.receipt.footer = fieldText(f,'receiptFooter',TEXT.receipt.footer);

  V.goalSeconds = fieldNumber(f,'goalSeconds',V.goalSeconds);
  V.tipAddsSeconds = fieldNumber(f,'tipAddsSeconds',V.tipAddsSeconds);
  V.randomMin = fieldNumber(f,'randomMin',V.randomMin);
  V.randomMax = fieldNumber(f,'randomMax',V.randomMax);
  V.minTipToCount = fieldNumber(f,'minTipToCount',V.minTipToCount);
  V.bitsPerDollar = fieldNumber(f,'bitsPerDollar',V.bitsPerDollar);
  V.subDollarsTier1 = fieldNumber(f,'subDollarsTier1',V.subDollarsTier1);
  V.subDollarsTier2 = fieldNumber(f,'subDollarsTier2',V.subDollarsTier2);
  V.subDollarsTier3 = fieldNumber(f,'subDollarsTier3',V.subDollarsTier3);
  V.subDollarsPrime = fieldNumber(f,'subDollarsPrime',V.subDollarsPrime);
  V.declinedSeconds = fieldNumber(f,'declinedSeconds',V.declinedSeconds);
  V.declinedFollowUpSeconds = fieldNumber(f,'declinedFollowUpSeconds',V.declinedFollowUpSeconds);
  V.receiptSeconds = fieldNumber(f,'receiptSeconds',V.receiptSeconds);
  V.leaderboardReset = fieldText(f,'leaderboardReset',V.leaderboardReset);
  V.blinkFrequency = fieldNumber(f,'blinkFrequency',V.blinkFrequency);
  V.anxiety = fieldNumber(f,'anxiety',V.anxiety);
  V.concern = fieldNumber(f,'concern',V.concern);
  V.pupilDilation = fieldNumber(f,'pupilDilation',V.pupilDilation);
  configuredPupilDilation = V.pupilDilation;
  V.timerStepSeconds = fieldNumber(f,'timerStepSeconds',V.timerStepSeconds);
  V.cardCheckSeconds = fieldNumber(f,'cardCheckSeconds',V.cardCheckSeconds);
  V.cardApprovedSeconds = fieldNumber(f,'cardApprovedSeconds',V.cardApprovedSeconds);
  widgetScale = fieldNumber(f,'widgetScale',1);

  Object.assign(CFG,{
    currency:TEXT.brand.currency,
    goalSeconds:V.goalSeconds,
    tipAddsSeconds:V.tipAddsSeconds,
    bitsPerUnit:V.bitsPerDollar,
    subValue:{1000:V.subDollarsTier1,2000:V.subDollarsTier2,3000:V.subDollarsTier3,prime:V.subDollarsPrime},
    receiptHold:V.receiptSeconds*1000,
    minToCount:V.minTipToCount,
    randomMin:V.randomMin,
    randomMax:V.randomMax,
    declineHold:V.declinedSeconds*1000,
    declineFollowUpHold:V.declinedFollowUpSeconds*1000,
    resetPeriod:V.leaderboardReset,
    cardCheckMs:(V.cardCheckSeconds||1.4)*1000,
    cardApprovedMs:(V.cardApprovedSeconds||1)*1000
  });
}

function loadPersistentState(){
  if (CFG.resetPeriod === 'stream') return;
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!saved || saved.period !== CURRENT_PERIOD) return;
    S.periodTotal = Number(saved.periodTotal)||0;
    S.drains = Number(saved.drains)||0;
    S.board = Object.fromEntries(Object.entries(saved.board||{}).map(([name,v])=>[name,{
      total:Number(v.total)||0,count:Number(v.count)||0,last:v.last?new Date(v.last):null,
      months:Object.fromEntries(Object.entries(v.months||{}).map(([key,m])=>[key,{
        total:Number(m.total)||0,count:Number(m.count)||0,last:m.last?new Date(m.last):null
      }]))
    }]));
  }catch(_){ }
}
function savePersistentState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      period:CURRENT_PERIOD,periodTotal:S.periodTotal,drains:S.drains,board:S.board
    }));
  }catch(_){ }
}

function fitWidget(){
  const available = Math.min((window.innerWidth-70)/510,(window.innerHeight-70)/750);
  R.style.setProperty('--scale',Math.max(.35,Math.min(widgetScale,available)));
}

function bootWidget(fields){
  if (widgetBooted) return;
  widgetBooted = true;
  hydrateFromFields(fields||{});
  CURRENT_PERIOD = periodKey();
  loadPersistentState();
  $('title').innerHTML =
    '<span class="nm">'+escapeHtml(TEXT.brand.titleGold)+'</span>'+
    '<span class="sfx">'+escapeHtml(TEXT.brand.titlePink)+'</span>';
  $('totalbar').querySelector('.lbl').textContent = TEXT.machine.totalLabel;
  $('board').querySelector('h3').textContent = TEXT.leaderboard.title;
  document.querySelector('.tab[data-tab="today"]').textContent = TEXT.leaderboard.tabToday;
  document.querySelector('.tab[data-tab="month"]').textContent = TEXT.leaderboard.tabMonth;
  $('reset-all').textContent = TEXT.leaderboard.resetAll;
  renderTotals();
  startIdle();
  scheduleBlink();
  scheduleDart();
  fitWidget();
  window.addEventListener('resize',fitWidget);
  setInterval(checkPeriodRollover,30000);
}

window.addEventListener('onWidgetLoad',e=>{
  bootWidget((e.detail&&e.detail.fieldData)||{});
});

window.addEventListener('onEventReceived',e=>{
  if (!widgetBooted || !e.detail) return;
  const listener = e.detail.listener;
  const event = e.detail.event || {};
  const name = event.name || event.displayName || event.from || 'Anonymous';
  if (listener === 'tip-latest'){
    contribute(name,Number(event.amount)||0,TEXT.alerts.tip);
  } else if (listener === 'cheer-latest'){
    contribute(name,(Number(event.amount)||0)/CFG.bitsPerUnit,TEXT.alerts.bits);
  } else if (listener === 'subscriber-latest'){
    const tier = event.isPrime ? 'prime' : String(event.tier||1000);
    contribute(name,CFG.subValue[tier]||CFG.subValue[1000],TEXT.alerts.sub);
  }
});


bootWidget({});
$('test').addEventListener('click', e=>{
  const a=e.target.getAttribute('data-act'); if(!a) return;
  if(a==='tip50') contribute('@Rina',50,TEXT.alerts.tip);
  if(a==='bits') contribute('@Molinnn',1500/CFG.bitsPerUnit,TEXT.alerts.bits);
  if(a==='sub') contribute('@ae2204',CFG.subValue[1000],TEXT.alerts.sub);
  if(a==='timeout' && S.state==='armed') S.deadline=Date.now();
});
(function placeTest(){
  const set=()=>{
    const box=R.getBoundingClientRect();
    $('test').style.left=(box.left+box.width/2)+'px';
    $('test').style.top=(box.bottom+8)+'px';
    $('test').style.width=box.width+'px';
  };
  set(); window.addEventListener('resize',set);
})();
</script>
